# The relay's database, replicated to R2. Changes reach R2 within a second;
# a crash can lose at most that last second of accepted events.
dbs:
  - path: /data/tackly-relay.db
    replica:
      type: s3
      endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      bucket: ${R2_BUCKET}
      path: relay
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
