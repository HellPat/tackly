[package]
name = "tackly-agent"
description = "An AI agent's way into a Tackly family: joins with an invitation, then reads along"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "tackly-agent"
path = "src/main.rs"

[dependencies]
tackly-phone.workspace = true
tackly-domain.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tackly-testkit = { path = "../../tests/testkit" }
chrono.workspace = true
libc = "0.2"
tempfile = "3"
