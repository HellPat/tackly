name: Sync server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:tackly_smoke_only@127.0.0.1:5432/tackly
      TACKLY_TEST_DB_COMMAND: psql
    steps:
      - uses: actions/checkout@v6
      - name: Start local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'tackly_smoke_only'"
          sudo -u postgres createdb tackly
          pg_isready -h 127.0.0.1 -U postgres -d tackly
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo run --locked -- migrate
      - name: Start relay
        run: |
          cargo run --locked > "$RUNNER_TEMP/tackly-sync.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              python3 tests/transport_smoke.py
              python3 tests/api_e2e.py
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/retention.sql
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tackly-sync.log"
          exit 1
