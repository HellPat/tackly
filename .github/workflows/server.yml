name: Sync server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: sqlite:///tmp/tackly-server-e2e.db
      TACKLY_TEST_DB_PATH: /tmp/tackly-server-e2e.db
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo run --locked -- migrate
      - name: Start relay
        run: |
          cargo run --locked > "$RUNNER_TEMP/tackly-sync.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              python3 tests/transport_smoke.py
              python3 tests/api_e2e.py
              python3 tests/retention.py
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tackly-sync.log"
          exit 1
