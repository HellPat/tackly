name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all --check
      - name: The compiled styles are up to date (`just css`)
        run: |
          curl -sSfL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o "$RUNNER_TEMP/tailwindcss"
          chmod +x "$RUNNER_TEMP/tailwindcss"
          "$RUNNER_TEMP/tailwindcss" --input apps/app/tailwind.css --output apps/app/src/style.css --minify
          git diff --exit-code apps/app/src/style.css
      - name: Unit and end-to-end tests (real server, three phones, SSE, outages)
        run: cargo test --locked -p tackly-domain -p tackly-wire -p tackly-phone -p tackly-relay -p tackly-agent

  deploy-relay:
    # Cloudflare builds and deploys the relay (apps/relay/cloudflare) only
    # when this calls its deploy hook; pushes alone do not deploy.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-relay
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - run: scripts/deploy-relay.sh
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          RELAY_URL: https://tackly.hellpat-playground.workers.dev

  app-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Clippy on everything, unwrap and expect denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: App tests (color schemes, the embedded icon font)
        run: cargo test --locked -p tackly-app
      - run: cargo build --locked --release -p tackly-relay -p tackly-app
      - uses: actions/upload-artifact@v4
        with:
          name: tackly-macos
          path: |
            target/release/tackly-relay
            target/release/tackly

  acceptance-macos:
    # Real app windows: the macOS runner has a desktop session.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --locked -p tackly-acceptance --test acceptance
