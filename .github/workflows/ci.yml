name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all --check
      - name: The compiled styles are up to date (`just css`)
        run: |
          curl -sSfL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o "$RUNNER_TEMP/tailwindcss"
          chmod +x "$RUNNER_TEMP/tailwindcss"
          "$RUNNER_TEMP/tailwindcss" --input apps/app/tailwind.css --output apps/app/src/style.css --minify
          git diff --exit-code apps/app/src/style.css
      - uses: ./.github/actions/relay-tools
      - name: The relay (WebAssembly) is formatted and passes clippy
        working-directory: apps/relay
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Unit and end-to-end tests (the relay under wrangler dev, three phones, live, outages)
        run: cargo test --locked -p tackly-domain -p tackly-wire -p tackly-phone -p tackly-agent

  quality:
    # Every line of domain, wire, phone and agent runs in their tests (the
    # phone's and the agent's against the relay under wrangler dev), and every
    # mutant (a small change to the code, as cargo-mutants makes them) of the
    # fast crates fails a test.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-mutants
      - uses: ./.github/actions/relay-tools
      - name: Every line runs in a test
        run: |
          for crate in tackly-domain tackly-wire tackly-phone tackly-agent; do
            scripts/coverage.sh "$crate"
          done
      - name: Every mutant is caught
        env:
          TACKLY_RELAY_DIR: ${{ github.workspace }}/apps/relay
        run: cargo mutants -p tackly-domain -p tackly-wire -p tackly-agent --timeout 300 --cargo-arg=--locked

  deploy-relay:
    # Cloudflare builds and deploys the relay (apps/relay) only when this
    # calls its deploy hook; pushes alone do not deploy.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-relay
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - run: scripts/deploy-relay.sh
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          RELAY_URL: https://relay.tackly.hellpat.com

  app-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Clippy on everything, unwrap and expect denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: App tests (color schemes, the embedded icon font)
        run: cargo test --locked -p tackly-app
      - run: cargo build --locked --release -p tackly-app
      - uses: actions/upload-artifact@v4
        with:
          name: tackly-macos
          path: target/release/tackly

  acceptance-macos:
    # Real app windows: the macOS runner has a desktop session.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/relay-tools
      - run: cargo test --locked -p tackly-acceptance --test acceptance
