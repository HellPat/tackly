name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgres://postgres:tackly_e2e_only@127.0.0.1:5432/tackly
    steps:
      - uses: actions/checkout@v6
      - name: Start local PostgreSQL
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'tackly_e2e_only'"
          sudo -u postgres createdb tackly
          pg_isready -h 127.0.0.1 -U postgres -d tackly
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - name: Start real sync server for Android end-to-end test
        working-directory: server
        run: |
          cargo run --locked -- migrate
          cargo run --locked > "$RUNNER_TEMP/tackly-sync.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tackly-sync.log"
          exit 1
      - name: Emulator end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: bash app/scripts/run-emulator-e2e.sh
      - name: Build Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v6
        with:
          name: tackly-android
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      TACKLY_KEYSTORE_BASE64: ${{ secrets.TACKLY_KEYSTORE_BASE64 }}
      TACKLY_STORE_PASSWORD: ${{ secrets.TACKLY_STORE_PASSWORD }}
      TACKLY_KEY_ALIAS: ${{ secrets.TACKLY_KEY_ALIAS }}
      TACKLY_KEY_PASSWORD: ${{ secrets.TACKLY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          for secret in TACKLY_KEYSTORE_BASE64 TACKLY_STORE_PASSWORD TACKLY_KEY_ALIAS TACKLY_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "Missing GitHub Actions secret: $secret" >&2
              exit 1
            fi
          done
          printf '%s' "$TACKLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tackly-upload.jks"
          {
            printf 'storePassword=%s\n' "$TACKLY_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$TACKLY_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$TACKLY_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/tackly-upload.jks"
          } > android/key.properties
          chmod 600 android/key.properties "$RUNNER_TEMP/tackly-upload.jks"
      - run: flutter pub get
      - name: Build signed release APK
        run: flutter build apk --release --build-number "${{ github.run_number }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-${{ github.run_number }}"
          apk="build/app/outputs/flutter-apk/tackly-$tag.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tackly $tag" \
            --notes "Android build from main at $GITHUB_SHA. Version code ${{ github.run_number }}."
