name: Android

# Builds the app for Android phones (arm64) and publishes it as the release
# "android-latest": open https://github.com/HellPat/tackly/releases/tag/android-latest
# on the phone, download tackly-debug.apk, install it.
#
# The APK is signed with the key in the secret ANDROID_DEBUG_KEYSTORE (base64 of
# a keystore with alias androiddebugkey, passwords "android"), so every build
# installs as an update over the previous one. Without the secret each build
# gets a new key and the old app must be uninstalled first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rust standard library for Android phones
        run: rustup target add aarch64-linux-android
      - name: Dioxus CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --locked dioxus-cli@0.7.10
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: this APK gets a new key and cannot update an installed one."
          fi
      - name: Build the APK
        working-directory: apps/app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: dx build --android --package tackly-app --no-default-features --features mobile --target aarch64-linux-android
      - name: Collect it
        run: |
          apk="$(find target/dx -name app-debug.apk | head -n 1)"
          test -n "$apk"
          cp "$apk" tackly-debug.apk
          ls -l tackly-debug.apk
      - name: Publish as android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest tackly-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android, latest main" \
            --notes "Debug build of ${GITHUB_SHA::7} for arm64 phones. Download tackly-debug.apk on the phone and install it (allow installing from your browser when asked)."
