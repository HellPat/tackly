name: tackly
description: "Tackly's offline Android task app with encrypted family sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  sqflite: ^2.4.4+1
  uuid: ^4.5.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
