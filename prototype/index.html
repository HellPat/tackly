<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tackly prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <!-- The only custom CSS: the font, two animations, and daisyUI's surface colours for the bottom sheet. -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: Roboto, system-ui, sans-serif;
      /* The accent: Tailwind's fuchsia, used as bg-accent-700 etc. */
      --color-accent-50: #fdf4ff;
      --color-accent-100: #fae8ff;
      --color-accent-200: #f5d0fe;
      --color-accent-700: #a21caf;
      --color-accent-800: #86198f;
      --color-accent-900: #701a75;
      --color-accent-ink: #ffffff;    /* text and icons on a filled accent */
      --animate-pop: pop .3s ease-out;
      --animate-breathe: breathe 2.4s ease-in-out infinite;
      /* Background drift: far layers slow, near layers a little faster (parallax). */
      --animate-drift-far: drift 40s ease-in-out infinite alternate;
      --animate-drift-mid: drift 28s ease-in-out infinite alternate;
      --animate-drift-near: drift 18s ease-in-out infinite alternate;
      @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
      @keyframes pop { 40% { transform: scale(1.3); } }
      @keyframes breathe { 50% { box-shadow: 0 0 0 16px transparent; } 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-700) 30%, transparent); } }
    }
  </style>
  <style>
    [data-theme=light] { --color-base-100: #fffdfb; --color-base-content: #292524; }
  </style>
</head>
<body class="bg-stone-300 text-stone-800 antialiased">
  <div id="app" class="fixed inset-0 mx-auto max-w-[430px] flex flex-col overflow-hidden bg-stone-100">

    <!-- A calm illustration at the bottom, behind the content (picked in the background switcher). -->
    <div id="scene" class="absolute inset-x-0 bottom-20 h-[42%] pointer-events-none" aria-hidden="true"></div>

    <header id="header" class="relative z-10 shrink-0 flex items-center gap-1 px-2 h-16">
      <button id="backBtn" class="hidden size-12 grid place-items-center rounded-full text-stone-700 hover:bg-stone-200" aria-label="Back"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span></button>
      <h1 id="title" class="flex-1 px-2 text-2xl font-semibold tracking-tight truncate">Tasks</h1>
      <button id="editBtn" class="hidden size-12 place-items-center rounded-full text-stone-700 hover:bg-stone-200" aria-label="Edit place"><span class="material-symbols-rounded" aria-hidden="true">edit</span></button>
      <span id="offline" class="hidden mr-2 items-center gap-1 h-8 px-3 rounded-full bg-stone-200 text-sm text-stone-700"><span class="material-symbols-rounded !text-[18px]" aria-hidden="true">cloud_off</span>Offline</span>
    </header>

    <!-- The content: the list and its main action, the add bar. -->
    <div id="content" class="relative flex-1 min-h-0 flex flex-col">
    <main id="main" class="relative z-10 flex-1 overflow-y-auto px-3 pb-6"></main>

    <!-- The bar at the bottom: adds a task, or (on Places) a place. -->
    <section id="composer" aria-label="Add" class="relative z-10 shrink-0 px-3 pb-3 pt-2 flex flex-col gap-2">
      <div id="extras" class="hidden flex-col gap-2"></div>
      <form id="addForm" class="flex items-center gap-2">
        <label class="flex-1 flex items-center gap-3 h-12 pl-2 pr-4 rounded-full bg-[#fffdfb] ring-1 ring-stone-300 shadow-sm focus-within:ring-2 focus-within:ring-accent-700">
          <span class="size-8 shrink-0 rounded-full grid place-items-center bg-accent-700 text-accent-ink" aria-hidden="true"><span class="material-symbols-rounded !text-[20px]">add</span></span>
          <input id="addInput" aria-label="Add a task" placeholder="Add a task" autocomplete="off" class="flex-1 min-w-0 border-0 bg-transparent p-0 text-base outline-none focus:outline-none placeholder:text-stone-500">
        </label>
        <button id="addBtn" aria-label="Add" class="hidden size-12 place-items-center rounded-md border border-accent-800 bg-accent-700 text-accent-ink shadow-sm inset-shadow-[0_1px_0_rgb(255_255_255/.18)] hover:bg-accent-800"><span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span></button>
      </form>
    </section>
    </div>

    <!-- Family: the one main action, right above the navigation. -->
    <section id="familyBar" class="hidden shrink-0 px-3 pb-3 pt-2" aria-label="Invite"></section>

    <nav id="dock" class="relative z-10 shrink-0 h-20 grid grid-cols-3 bg-[#fffdfb] shadow-[0_-1px_0_var(--color-stone-200)]" aria-label="Main"></nav>

    <!-- A task in focus: full screen, no navigation. -->
    <section id="detail" class="hidden absolute inset-0 z-40 bg-[#fffdfb] flex-col" aria-label="Task"></section>

    <dialog id="sheet" class="modal modal-bottom">
      <div class="modal-box rounded-t-[28px] px-6 pt-3 pb-8 shadow-2xl">
        <div class="mx-auto mb-5 h-1 w-8 rounded-full bg-stone-300"></div>
        <div id="sheetBody"></div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>Close</button></form>
    </dialog>

    <!-- Toasts, stacked like Sonner: newest in front, older ones tucked behind; hover to fan them out. -->
    <section id="toasts" class="absolute inset-x-4 bottom-40 z-50 h-0" aria-label="Notifications" aria-live="polite"></section>
  </div>

  <!-- Prototype tool, not part of the app: try page backgrounds. -->
  <details id="bgSwitcher" class="max-[600px]:hidden fixed top-3 right-3 z-[60] rounded-xl bg-white shadow-lg text-sm text-stone-800 open:p-3 [&:not([open])]:p-0">
    <summary class="list-none cursor-pointer size-10 grid place-items-center rounded-xl" aria-label="Background"><span class="material-symbols-rounded" aria-hidden="true">wallpaper</span></summary>
    <div class="mt-2 grid grid-cols-5 gap-2 w-[420px]" role="radiogroup" aria-label="Background"></div>
  </details>

<script>
const $ = (s) => document.querySelector(s);
const icon = (name, cls = '') => `<span class="material-symbols-rounded ${cls}" aria-hidden="true">${name}</span>`;
const FILL = "[font-variation-settings:'FILL'_1]";
const MIN = 60_000, now = () => Date.now();

/* Buttons, GitHub style: primary filled, secondary neutral. */
const BTN = 'inline-flex items-center justify-center gap-2 h-10 px-4 rounded-md border font-semibold shadow-sm transition-colors active:shadow-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-700';
const PRIMARY = `${BTN} border-accent-800 bg-accent-700 text-accent-ink inset-shadow-[0_1px_0_rgb(255_255_255/.18)] hover:bg-accent-800`;
const SECONDARY = `${BTN} border-stone-300 bg-stone-50 text-stone-800 inset-shadow-[0_1px_0_white] hover:bg-stone-100`;
const PILL = 'inline-flex items-center h-6 px-2.5 rounded-full bg-stone-100 text-stone-700 text-[13px] font-semibold';
const CARD = 'bg-[#fffdfb] rounded-2xl shadow-sm';
const TINTS = ['bg-sky-100 text-sky-900', 'bg-pink-100 text-pink-900', 'bg-teal-100 text-teal-900', 'bg-amber-100 text-amber-900', 'bg-violet-100 text-violet-900'];

const state = {
  tab: 'tasks', filter: (() => { try { return localStorage.getItem('tackly-filter') || 'mine'; } catch { return 'mine'; } })(), placeView: null, personView: null, editPlace: false, chosen: new Set(), detail: null,
  // Lists people made. Besides them there is always "Other" (id 'other'): it can't be deleted, and new tasks land there.
  lists: [{ id: 'home', name: 'Household' }, { id: 'shop', name: 'Shopping' }, { id: 'garden', name: 'Garden' }],
  listView: null, // the list you stepped into on Tasks
  groupView: null, // the group you stepped into on Places
  groups: [{ id: 'g1', name: 'Grocery Store' }, { id: 'g2', name: 'Hardware' }],
  places: [
    { id: 'lidl', group: 'g1', name: 'LIDL', locations: [{ name: 'LIDL Winnenden', address: 'Marbacher Straße 1, Winnenden' }, { name: 'LIDL Backnang', address: 'Stuttgarter Straße 3, Backnang' }] },
    { id: 'aldi', group: 'g1', name: 'Aldi', locations: [{ name: 'Aldi Waiblingen', address: 'Bahnhofstraße 50, Waiblingen' }] },
    { id: 'bauhaus', group: 'g2', name: 'Bauhaus', locations: [{ name: 'Bauhaus Backnang', address: 'Stuttgarter Straße 9, Backnang' }] },
  ],
  members: [
    { id: 'p', name: 'Patrick', me: true, avatar: { icon: 'sailing', tint: 0 } },
    { id: 'mo', name: 'Mona', avatar: { icon: 'local_florist', tint: 1 } },
    { id: 'ma', name: 'Mara', avatar: { icon: 'pets', tint: 2 } },
  ],
  // Work sessions since the task was (re)opened; reopening starts over.
  tasks: [
    { id: 4, title: 'Water the plants', list: 'home', places: [], status: 'open', on: 'mo', sessions: [{ from: now() - 4 * MIN }] },
    { id: 8, title: 'Vacuum the stairs', list: 'home', places: [], status: 'open', on: 'ma', sessions: [{ from: now() - 30 * MIN, to: now() - 12 * MIN }] },
    { id: 9, title: 'Book the holiday', list: 'home', places: [], status: 'open', on: 'mo', sessions: [] },
    { id: 6, title: 'Call the dentist', list: 'other', places: [], status: 'open', sessions: [{ from: now() - 26 * 60 * MIN, to: now() - 25.6 * 60 * MIN }, { from: now() - 50 * MIN, to: now() - 38 * MIN }] },
    { id: 1, title: 'Milk', list: 'shop', places: ['lidl', 'aldi'], status: 'open', sessions: [] },
    { id: 2, title: 'Bread', list: 'shop', places: ['lidl'], status: 'open', sessions: [] },
    { id: 3, title: 'Light bulbs', list: 'shop', places: ['bauhaus'], status: 'open', sessions: [] },
    { id: 7, title: 'Pick up the parcel', list: 'other', places: [], status: 'open', sessions: [] },
  ],
  recent: ['Altglas leeren', 'Feed the cat'],
};
// What the address search would answer (Photon in the app).
const FOUND = [
  { name: 'Kaufland', address: 'Max-Eyth-Straße 2, Winnenden' },
  { name: 'Kaufland', address: 'Fronackerstraße 30, Waiblingen' },
  { name: 'dm', address: 'Marktstraße 41, Winnenden' },
];
const placeById = (id) => state.places.find((p) => p.id === id);
const listById = (id) => state.lists.find((l) => l.id === id);
const member = (id) => state.members.find((m) => m.id === id);
const find = (id) => state.tasks.find((t) => t.id == id);
const visible = () => state.tasks.filter((t) => t.status === 'open');
const openAt = (p) => visible().filter((t) => t.places.includes(p.id));
const pill = (p) => `<span class="${PILL}">${p.name}</span>`;
const heading = (text) => `<h2 class="px-2 pt-6 pb-2 text-sm font-semibold text-stone-600">${text}</h2>`;
/* What the bottom bar adds here: a task, a place, or a location of the place being edited. */
const barMode = () => state.tab === 'tasks' ? 'task'
  : state.editPlace ? 'location' : state.placeView ? 'task' : state.groupView ? 'place' : 'group';
/* A person's picture: an icon on a soft tint, or a photo. Round, with a white border and a small shadow,
   so any photo (too light, too busy, badly cropped) still sits cleanly on the page. */
const avatar = (m, size = 'size-10') => `<span class="relative ${size} shrink-0 rounded-full overflow-hidden grid place-items-center ${TINTS[m.avatar.tint]} ${{ 'size-24': 'border-4', 'size-12': 'border-[3px]', 'size-10': 'border-[3px]' }[size] ?? 'border-2'} border-white shadow-[0_1px_3px_rgb(41_37_36/.3)]">
  ${m.avatar.photo ? `<img src="${m.avatar.photo}" alt="" class="size-full object-cover">` : icon(m.avatar.icon, size === 'size-24' ? '!text-[40px]' : size === 'size-12' ? '!text-[28px]' : size === 'size-8' ? '!text-[18px]' : '')}</span>`;

/* Time worked: today, and in total since the task was (re)opened. */
function worked(t) {
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  let total = 0, today = 0;
  for (const s of t.sessions) { const end = s.to ?? now(); total += end - s.from; today += Math.max(0, end - Math.max(s.from, +midnight)); }
  return { total, today };
}
const running = (t) => t.sessions.some((s) => !s.to);
/* Someone on a task is working now, paused, or has only picked it. */
const progress = (t) => !t.on ? null : running(t) ? 'working' : t.sessions.length ? 'paused' : 'picked';
const PROGRESS = {
  working: { icon: 'play_arrow', left: 'bg-stone-300 text-stone-700', me: 'You’re working on it', other: (n) => `${n} is working on it` },
  paused:  { icon: 'pause',      left: 'border-2 border-stone-300 text-stone-600',                me: 'You paused it',          other: (n) => `${n} paused it` },
  picked:  { icon: 'flag',       left: 'border-2 border-dashed border-stone-400 text-stone-600',           me: 'You picked it',          other: (n) => `${n} picked it` },
};
const clock = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const short = (ms) => { const m = Math.round(ms / MIN); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };

/* ---- Toasts (Sonner-like) ---------------------------------------------------------------- */
const toasts = []; // newest first: { id, text, action, onAction, left, el }
let fanned = false;
const TOAST_MS = 4000, TOAST_GAP = 72, TOAST_SHOWN = 3;
function toast(text, action, onAction) {
  const t = { id: now() + Math.random(), text, action, onAction, left: TOAST_MS };
  t.el = document.createElement('div');
  t.el.setAttribute('role', 'status');
  t.el.innerHTML = `<span class="flex-1 min-w-0 truncate">${text}</span>${action ? `<button class="${SECONDARY} !h-10 !px-3">${icon('undo', '!text-[20px]')}${action}</button>` : ''}`;
  t.el.querySelector('button')?.addEventListener('click', () => { onAction(); dismiss(t); });
  t.el.className = toastClass(-1);
  $('#toasts').prepend(t.el);
  toasts.unshift(t);
  requestAnimationFrame(() => requestAnimationFrame(layoutToasts));
}
function dismiss(t) {
  const i = toasts.indexOf(t); if (i < 0) return;
  toasts.splice(i, 1);
  t.el.className = toastClass(-2);
  setTimeout(() => t.el.remove(), 300);
  layoutToasts();
}
/* -1: entering from below; -2: leaving; 0..: position in the stack. */
function toastClass(i) {
  const base = 'absolute inset-x-0 bottom-0 mx-auto max-w-[360px] flex items-center gap-3 h-16 pl-4 pr-3 rounded-xl bg-white border border-stone-200 shadow-lg text-sm text-stone-800 origin-bottom transition-all duration-300 ease-out';
  if (i === -1) return `${base} translate-y-full opacity-0`;
  if (i === -2) return `${base} translate-y-4 opacity-0 pointer-events-none`;
  const z = ['z-30', 'z-20', 'z-10'][i] ?? 'z-0';
  if (i >= TOAST_SHOWN) return `${base} ${z} opacity-0 pointer-events-none -translate-y-5 scale-[.85]`;
  if (fanned) return `${base} ${z} -translate-y-[${i * TOAST_GAP}px]`;
  return `${base} ${z} ${['', '-translate-y-2.5 scale-[.95]', '-translate-y-5 scale-[.9]'][i]}`;
}
function layoutToasts() { toasts.forEach((t, i) => { t.el.className = toastClass(i); }); }
$('#toasts').addEventListener('mouseenter', () => { fanned = true; layoutToasts(); });
$('#toasts').addEventListener('mouseleave', () => { fanned = false; layoutToasts(); });
setInterval(() => { if (fanned) return; for (const t of [...toasts]) { t.left -= 100; if (t.left <= 0) dismiss(t); } }, 100);

/* ---- Screens ------------------------------------------------------------------------------- */
function sheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').showModal(); }

/* A task card: the circle finishes it, the rest opens it.
   When someone else is on it, their picture takes the circle's place and the card is locked. */
function taskCard(t, flat = false) {
  const who = t.on && member(t.on), how = progress(t);
  const mine = who?.me, taken = who && !mine;
  const st = how && PROGRESS[how];
  // Left: what state it is in. The finish circle when I can act; the other person's state when I can't.
  const lead = taken
    ? `<span class="size-12 shrink-0 grid place-items-center" role="img" aria-label="${st.other(who.name)}"><span class="size-6 rounded-full grid place-items-center ${st.left}">${icon(st.icon, `!text-[16px] ${FILL}`)}</span></span>`
    : `<label class="size-12 shrink-0 grid place-items-center cursor-pointer">
        <input type="checkbox" class="peer sr-only" data-check="${t.id}" aria-label="Done: ${t.title}">
        <span class="size-6 rounded-full border-2 border-stone-400 grid place-items-center transition-colors hover:border-accent-700 peer-checked:bg-accent-700 peer-checked:border-accent-700 peer-checked:animate-pop peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent-700">
          ${icon('check', '!text-[16px] text-accent-ink')}
        </span>
      </label>`;
  // Given to someone by someone else reads as "Assigned to …", not "… picked it".
  const given = how === 'picked' && t.by && t.by !== t.on;
  const line = st && (given ? `Assigned to ${mine ? 'you' : who.name}` : mine ? st.me : st.other(who.name));
  // Right: who has it.
  // Nobody on it: a placeholder picture that assigns the task to someone.
  const assignee = who ? `<span class="shrink-0 pl-2 ${taken ? 'grayscale opacity-60' : ''}">${avatar(who, 'size-8')}</span>`
    : `<button class="group shrink-0 size-12 -mr-2 grid place-items-center" data-assign="${t.id}" aria-label="Assign ${t.title}">
        <span class="size-8 rounded-full grid place-items-center bg-stone-100 border-2 border-dashed border-white shadow-[0_1px_3px_rgb(41_37_36/.3)] text-stone-500 transition-colors group-hover:text-accent-700">${icon('person_add', '!text-[18px]')}</span>
      </button>`;
  const shell = flat ? 'max-h-40 overflow-hidden transition-all duration-300' : `${CARD} mb-2 max-h-40 overflow-hidden transition-all duration-300`;
  // Someone else's task: an opaque, slightly grey card without shadow, so it reads as disabled on any background.
  const lockedLook = flat ? 'bg-stone-100' : '!bg-stone-100 !shadow-none';
  return `<li class="${shell} ${mine && how === 'working' ? 'border-l-4 border-accent-700' : ''} ${taken ? lockedLook : ''}" data-card="${t.id}" ${taken ? 'aria-disabled="true"' : ''}>
    <div class="flex items-center gap-1 pl-1 pr-3 min-h-16">
      ${lead}
      <button class="flex-1 min-w-0 text-left py-3 flex flex-col gap-0.5 disabled:cursor-default" data-open="${t.id}" ${taken ? 'disabled' : ''}>
        <span class="text-base truncate ${taken ? 'text-stone-600' : ''}">${t.title}</span>
        ${line ? `<span class="sr-only">${line}</span>` : ''}
      </button>
      ${assignee}
    </div>
  </li>`;
}

/* Empty states: a normal-size icon in a tinted circle, a short friendly line. */
function emptyState(ic, title, line) {
  return `<div class="flex flex-col items-center text-center gap-2 py-20 px-8">
    <span class="size-16 mb-2 rounded-full grid place-items-center bg-accent-100 text-accent-800">${icon(ic, '!text-[32px]')}</span>
    <span class="text-lg font-semibold">${title}</span><span class="text-stone-600">${line}</span></div>`;
}

/* Three filters, Mine first: what I am on, what nobody is on, everything. Each shows its count. */
const FILTERS = {
  mine: { label: 'Mine', keep: (t) => t.on === 'p' },
  free: { label: 'Unassigned', keep: (t) => !t.on },
  all:  { label: 'All', keep: () => true },
};
/* Tasks, parent level: the lists, like places. Step into one to see its tasks. */
/* One row of an overview (lists, groups, places): icon, name, a count, chevron. */
const overviewRow = (data, ic, name, count, sub = '') => `<li><button class="w-full flex items-center gap-3 px-4 min-h-16 text-left hover:bg-stone-50 active:bg-stone-100" ${data}>
  <span class="size-9 shrink-0 rounded-full grid place-items-center bg-stone-100 text-stone-600">${icon(ic, '!text-[18px]')}</span>
  <span class="flex-1 min-w-0"><span class="block text-base truncate">${name}</span>${sub ? `<span class="block text-sm text-stone-600">${sub}</span>` : ''}</span>
  ${count ? `<span class="text-sm text-stone-600">${count}</span>` : ''}
  ${icon('chevron_right', 'text-stone-500')}</button></li>`;

/* Tasks overview: the lists to step into, then "Other" shown open, with its tasks right here. */
function renderLists() {
  const rows = state.lists.map((l) => {
    const n = filtered(visible().filter((t) => t.list === l.id)).length;
    return overviewRow(`data-open-list="${l.id}"`, 'checklist', l.name, n ? `${n} ${{ mine: 'yours', free: 'unassigned', all: 'open' }[state.filter]}` : '');
  }).join('');
  const newList = `<div class="mt-3 flex justify-center"><button class="${SECONDARY}" data-new-list>${icon('add', '!text-[18px]')}New list</button></div>`;
  // "Other" looks like a list, but always open: its tasks sit right inside. Nothing to show, no card.
  const other = filtered(visible().filter((t) => t.list === 'other'));
  const otherCard = other.length ? `<section class="${CARD} overflow-hidden mt-4" aria-label="Other">
      <div class="flex items-center gap-3 px-4 min-h-14">
        <span class="size-9 shrink-0 rounded-full grid place-items-center bg-stone-100 text-stone-600">${icon('checklist', '!text-[18px]')}</span>
        <h2 class="flex-1 text-base">Other</h2>
        <span class="text-sm text-stone-600">${other.length} ${{ mine: 'yours', free: 'unassigned', all: 'open' }[state.filter]}</span>
        ${icon('expand_less', 'text-stone-500')}
      </div>
      <ul class="pb-1">${other.map((t) => taskCard(t, true)).join('')}</ul>
    </section>` : '';
  return `${filterBar(visible())}
    ${rows ? `<ul class="${CARD} overflow-hidden">${rows}</ul>` : ''}${otherCard}${newList}`;
}

/* The filter chips (Mine / Unassigned / All) with counts for the tasks on this screen. One setting for the whole app. */
function filterBar(all) {
  const chips = Object.entries(FILTERS).map(([id, { label, keep }]) => {
    const on = state.filter === id, n = all.filter(keep).length;
    return `<button data-filter="${id}" aria-pressed="${on}" class="shrink-0 inline-flex items-center gap-1.5 h-9 px-3.5 rounded-full text-sm font-semibold transition-colors ${on ? 'bg-stone-600 text-white' : 'bg-[#fffdfb] text-stone-800 shadow-sm'}">${label}<span class="${on ? 'text-stone-200' : 'text-stone-500'} font-normal">${n}</span></button>`;
  }).join('');
  return `<div class="flex gap-2 pt-1 pb-3" role="group" aria-label="Filter">${chips}</div>`;
}
const filtered = (tasks) => tasks.filter(FILTERS[state.filter].keep);

/* Tasks of one list or one place, filtered. */
function taskList(all, emptyAll) {
  if (!all.length) return emptyState('celebration', 'All done', emptyAll);
  const tasks = filtered(all);
  if (tasks.length) return `${filterBar(all)}<ul>${tasks.map((t) => taskCard(t)).join('')}</ul>`;
  if (state.filter === 'mine') return `${filterBar(all)}<p class="py-16 text-center text-stone-600">Nothing of yours here.</p>`;
  return `${filterBar(all)}<p class="py-16 text-center text-stone-600">Every task here has someone on it.</p>`;
}

function renderTasks() {
  if (!state.listView) return renderLists();
  return taskList(visible().filter((t) => t.list === state.listView), 'Nothing left to do. Enjoy it.');
}

function renderPlaces() {
  if (state.placeView && state.editPlace) return renderPlaceEdit(placeById(state.placeView));
  if (state.placeView) {
    const p = placeById(state.placeView);
    const n = p.locations.length;
    return `<button class="flex items-center gap-1.5 px-2 pb-3 text-sm text-stone-600 hover:text-stone-800" data-edit-place>${icon('location_on', '!text-[18px] text-stone-500')}${n} ${n === 1 ? 'location' : 'locations'}</button>
      ${taskList(openAt(p), 'Nothing to get here.')}`;
  }
  // Inside a group: its places, the one with the most to get first.
  if (state.groupView) {
    const places = state.places.filter((p) => p.group === state.groupView).sort((a, b) => openAt(b).length - openAt(a).length);
    if (!places.length) return emptyState('storefront', 'No places here yet', 'Add one below, for example LIDL.');
    return `<ul class="${CARD} overflow-hidden mt-1">${places.map((p) => { const n = openAt(p).length; return overviewRow(`data-place="${p.id}"`, 'storefront', p.name, n ? `${n} to get` : ''); }).join('')}</ul>`;
  }
  // Overview: the groups.
  if (!state.groups.length) return emptyState('storefront', 'No places yet', 'Start with a group below, for example Grocery Store.');
  return `<ul class="${CARD} overflow-hidden mt-1">${state.groups.map((g) => {
    const places = state.places.filter((p) => p.group === g.id);
    const n = places.reduce((sum, p) => sum + openAt(p).length, 0);
    return overviewRow(`data-open-group="${g.id}"`, 'category', g.name, n ? `${n} to get` : '', `${places.length} ${places.length === 1 ? 'place' : 'places'}`);
  }).join('')}</ul>`;
}

/* Editing a place: its name, and its locations as a plain list. New locations come from the bottom bar. */
/* A place's group: move it to another one, or to a new one. */
const CHIP = 'shrink-0 inline-flex items-center gap-1 h-9 px-3.5 rounded-full text-sm font-semibold transition-colors';
function groupPicker(p) {
  const chip = (id, label) => {
    const on = (p.group ?? null) === id;
    return `<button data-group="${id ?? ''}" aria-pressed="${on}" class="${CHIP} ${on ? 'bg-stone-600 text-white' : 'bg-[#fffdfb] text-stone-800 shadow-sm'}">${label}</button>`;
  };
  return `<div class="px-1 pt-5">
    <span class="block text-sm font-semibold text-stone-600" id="groupLabel">Group</span>
    <div class="mt-2 flex flex-wrap gap-2" role="group" aria-labelledby="groupLabel">
      ${state.groups.map((g) => chip(g.id, g.name)).join('')}
      <button data-new-group class="${CHIP} border border-dashed border-stone-400 text-stone-700">${icon('add', '!text-[18px]')}New group</button>
    </div>
  </div>`;
}

function renderPlaceEdit(p) {
  const only = p.locations.length === 1;
  return `<label class="block px-1 pt-1">
      <span class="text-sm font-semibold text-stone-600">Name</span>
      <input id="placeName" value="${p.name}" class="mt-1.5 w-full h-12 px-4 rounded-md bg-[#fffdfb] border border-stone-300 shadow-sm text-base outline-none focus:ring-2 focus:ring-accent-700">
    </label>
    ${groupPicker(p)}
    ${heading('Locations')}
    <ul class="${CARD} overflow-hidden">${p.locations.map((l, i) => `<li class="flex items-center gap-3 pl-4 pr-1 min-h-16">
      ${icon('location_on', 'text-stone-500')}
      <span class="flex-1 min-w-0"><span class="block truncate">${l.name}</span><span class="block text-sm text-stone-600 truncate">${l.address}</span></span>
      <button class="size-12 grid place-items-center rounded-full text-stone-600 hover:bg-stone-100 disabled:opacity-40 disabled:hover:bg-transparent" data-remove-location="${i}" aria-label="Remove ${l.name}" ${only ? 'disabled title="A place needs at least one location"' : ''}>${icon('close')}</button>
    </li>`).join('')}</ul>`;
}

/* Family: everyone, with how many tasks they are on. Open a person to see those tasks. */
function renderFamily() {
  if (state.personView) {
    const m = member(state.personView);
    const tasks = visible().filter((t) => t.on === m.id);
    return tasks.length ? `<ul class="pt-1">${tasks.map((t) => taskCard(t)).join('')}</ul>`
      : `<p class="py-16 text-center text-stone-600">${m.me ? 'You are' : `${m.name} is`} not on any task.</p>`;
  }
  return `<ul class="${CARD} overflow-hidden mt-1">${state.members.map((m) => {
    const n = visible().filter((t) => t.on === m.id).length;
    return `<li><button class="w-full flex items-center gap-4 px-4 min-h-16 text-left hover:bg-stone-50 active:bg-stone-100" data-person="${m.id}">
      ${avatar(m)}<span class="flex-1 text-base">${m.name}</span>
      ${n ? `<span class="text-sm text-stone-600">${n} ${n === 1 ? 'task' : 'tasks'}</span>` : ''}
      ${icon('chevron_right', 'text-stone-500')}</button></li>`;
  }).join('')}</ul>`;
}

/* One name dialog for lists and groups: create a new one, or rename (delete only when nothing is in it). */
function nameSheet(kind, id) {
  const what = kind === 'list' ? 'list' : 'group';
  const bucket = id && (kind === 'list' ? listById(id) : state.groups.find((g) => g.id === id));
  const empty = id && (kind === 'list' ? !state.tasks.some((t) => t.list === id && t.status === 'open') : !state.places.some((p) => p.group === id));
  const aside = !id ? '<span class="mr-auto"></span>'
    : empty ? `<button type="button" class="mr-auto text-sm text-stone-600 underline underline-offset-4 hover:text-stone-900" data-delete="${kind}" data-id="${id}">Delete ${what}</button>`
    : `<span class="mr-auto text-sm text-stone-600">${kind === 'list' ? 'Lists with open tasks can’t be deleted.' : 'Groups with places can’t be deleted.'}</span>`;
  sheet(`<form id="nameForm" data-kind="${kind}" data-id="${id ?? ''}">
    <h2 class="text-xl font-semibold">${id ? `Rename ${what}` : `New ${what}`}</h2>
    <input id="nameInput" aria-label="${what === 'list' ? 'List' : 'Group'} name" value="${bucket?.name ?? ''}" placeholder="${kind === 'list' ? 'e.g. Garden' : 'e.g. Grocery Store'}" class="mt-4 w-full h-12 px-4 rounded-md bg-[#fffdfb] border border-stone-300 shadow-sm text-base outline-none focus:ring-2 focus:ring-accent-700">
    <div class="mt-5 flex items-center gap-2">${aside}
      <button type="button" class="${SECONDARY}" data-close-sheet>Cancel</button>
      <button class="${PRIMARY}">${id ? 'Save' : 'Create'}</button>
    </div></form>`);
  $('#nameInput').focus();
}

/* The picture: an icon on a tint, or a photo. Always round. */
function avatarSheet() {
  const me = state.members.find((m) => m.me);
  const icons = ['sailing', 'local_florist', 'pets', 'rocket_launch', 'sports_soccer', 'music_note', 'coffee', 'bolt'];
  sheet(`<div class="flex flex-col items-center gap-5">
    <h2 class="text-xl font-semibold">Your picture</h2>${avatar(me, 'size-24')}
    <div class="grid grid-cols-4 gap-3">${icons.map((ic, i) => `<button class="size-14 rounded-full grid place-items-center ${TINTS[i % 5]} ${me.avatar.icon === ic && !me.avatar.photo ? 'ring-2 ring-accent-700 ring-offset-2 ring-offset-[#fffdfb]' : ''}" data-pick="${ic}" data-tint="${i % 5}" aria-label="${ic.replace('_', ' ')}">${icon(ic)}</button>`).join('')}</div>
    <label class="${PRIMARY} cursor-pointer">${icon('photo_camera', '!text-[18px]')}Take or choose a photo<input type="file" accept="image/*" capture="user" class="hidden" id="photo"></label>
  </div>`);
  $('#photo').addEventListener('change', (e) => { const f = e.target.files[0]; if (!f) return; me.avatar.photo = URL.createObjectURL(f); $('#sheet').close(); render(); });
}

function qrSvg() {
  let cells = '';
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const f = (ox, oy) => { const a = x - ox, b = y - oy; return a >= 0 && a < 7 && b >= 0 && b < 7 ? (a % 6 === 0 || b % 6 === 0 || (a > 1 && a < 5 && b > 1 && b < 5)) : null; };
    if (f(0, 0) ?? f(18, 0) ?? f(0, 18) ?? (((x * 31 + y * 17) ^ (x * y)) % 3 === 0)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-2 -2 29 29" class="size-56 bg-white rounded-2xl" role="img" aria-label="Invitation QR code"><g fill="#000">${cells}</g></svg>`;
}

/* Full-screen task: a big clock, Start/Pause, Finish. */
function renderDetail() {
  const el = $('#detail');
  const t = state.detail && find(state.detail);
  el.classList.toggle('hidden', !t); el.classList.toggle('flex', !!t);
  if (!t) return;
  const { total, today } = worked(t), on = running(t);
  el.innerHTML = `
    <div class="flex items-center px-2 h-16 shrink-0"><button class="size-12 grid place-items-center rounded-full text-stone-700 hover:bg-stone-100" data-close-detail aria-label="Back">${icon('arrow_back')}</button></div>
    <div class="px-6 flex flex-col gap-3">
      <h1 class="text-3xl font-semibold tracking-tight">${t.title}</h1>
      ${t.places.length ? `<div class="flex flex-wrap gap-1.5">${t.places.map(placeById).map(pill).join('')}</div>` : ''}
    </div>
    <div class="flex-1 grid place-items-center">
      <div class="size-64 rounded-full grid place-items-center border-[6px] ${on ? 'border-accent-700 bg-linear-160 from-accent-50 to-accent-100 animate-breathe' : 'border-transparent bg-stone-100'}">
        <div class="text-center">
          <div class="text-xs font-semibold uppercase tracking-wider text-stone-600">Today</div>
          <div class="mt-1 text-5xl font-semibold tabular-nums" id="clockToday" role="timer" aria-label="Worked today">${clock(today)}</div>
          <div class="mt-2 text-sm text-stone-600 tabular-nums" id="clockTotal">${short(total)} in total</div>
        </div>
      </div>
    </div>
    <div class="px-6 pb-10 grid grid-cols-2 gap-3">
      <button class="${on ? SECONDARY : PRIMARY} !h-14 text-base" data-toggle-run="${t.id}">${icon(on ? 'pause' : 'play_arrow')}${on ? 'Pause' : 'Start'}</button>
      <button class="${on ? PRIMARY : SECONDARY} !h-14 text-base" data-finish-detail="${t.id}">${icon('check')}Finish</button>
    </div>`;
}
setInterval(() => {
  const t = state.detail && find(state.detail); if (!t || !running(t)) return;
  const { total, today } = worked(t);
  $('#clockToday').textContent = clock(today); $('#clockTotal').textContent = `${short(total)} in total`;
}, 1000);

function renderDock() {
  const items = [['tasks', 'task_alt', 'Tasks'], ['places', 'storefront', 'Places'], ['family', 'group', 'Family']];
  $('#dock').innerHTML = items.map(([id, ic, label]) => {
    const on = state.tab === id;
    return `<button data-tab="${id}" class="flex flex-col items-center justify-center gap-1" ${on ? 'aria-current="page"' : ''}>
      <span class="w-16 h-8 rounded-full grid place-items-center transition-colors ${on ? 'bg-accent-100 text-accent-900' : 'text-stone-600'}">${icon(ic, on ? FILL : '')}</span>
      <span class="text-xs ${on ? 'font-semibold text-stone-900' : 'text-stone-600'}">${label}</span></button>`;
  }).join('');
}

/* Above the bar while typing: for a task, place pills and add-again chips; for a place, only the address search. */
function renderExtras() {
  const typed = $('#addInput').value.trim();
  if (barMode() === 'place' || barMode() === 'location') {
    const found = typed.length >= 3 ? FOUND.filter((f) => `${f.name} ${f.address}`.toLowerCase().includes(typed.toLowerCase().split(' ')[0])) : [];
    $('#extras').innerHTML = found.length ? `<ul class="${CARD} shadow-md overflow-hidden" aria-label="Addresses">${found.map((f, i) => `
      <li><button type="button" class="w-full flex items-center gap-3 px-4 min-h-14 text-left hover:bg-stone-50" data-found="${i}">
        ${icon('location_on', 'text-stone-500')}<span><span class="block">${f.name}</span><span class="block text-sm text-stone-600">${f.address}</span></span></button></li>`).join('')}</ul>` : '';
    return;
  }
  // Quick chips for tasks are left out for now.
  $('#extras').innerHTML = '';
  return;
  const pills = state.places.slice(0, 5).map((p) => {
    const on = state.chosen.has(p.id);
    return `<button type="button" data-chip="${p.id}" aria-pressed="${on}" class="shrink-0 inline-flex items-center gap-1 h-9 px-3.5 rounded-full text-sm font-semibold transition-colors ${on ? 'bg-stone-600 text-white' : 'bg-[#fffdfb] text-stone-800 shadow-sm'}">${p.name}</button>`;
  }).join('');
  const again = state.recent.slice(0, 5).map((s) => `<button type="button" data-suggest="${s}" class="shrink-0 inline-flex items-center gap-1 h-9 px-3.5 rounded-full bg-[#fffdfb] text-sm shadow-sm">${icon('add', '!text-[18px] text-accent-700')}${s}</button>`).join('');
  $('#extras').innerHTML = `<div class="flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Where">${pills}</div><div class="flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Add again">${again}</div>`;
}

function renderComposer() {
  $('#composer').classList.toggle('hidden', !(state.tab === 'tasks' || state.tab === 'places'));
  const label = { list: 'Add a list', group: 'Add a group', task: 'Add a task', place: 'Add a place', location: 'Add a location' }[barMode()];
  $('#addInput').placeholder = label; $('#addInput').setAttribute('aria-label', label);
  renderExtras();
}

function render() {
  const titles = { tasks: 'Tasks', places: 'Places', family: 'The Smiths' };
  const inPlace = state.tab === 'places' && state.placeView;
  const inPerson = state.tab === 'family' && state.personView;
  const inList = state.tab === 'tasks' && state.listView;
  const inGroup = state.tab === 'places' && state.groupView && !state.placeView;
  $('#title').textContent = inList ? listById(state.listView).name : inGroup ? state.groups.find((g) => g.id === state.groupView).name : inPlace ? (state.editPlace ? 'Edit place' : placeById(state.placeView).name) : inPerson ? member(state.personView).name : titles[state.tab];
  // Edit lives in the top bar: for a place, and for yourself.
  const canEdit = inList || inGroup || (inPlace && !state.editPlace) || (inPerson && member(state.personView).me);
  $('#editBtn').setAttribute('aria-label', inList ? 'Edit list' : inGroup ? 'Edit group' : inPerson ? 'Edit your picture' : 'Edit place');
  $('#editBtn').classList.toggle('hidden', !canEdit); $('#editBtn').classList.toggle('grid', !!canEdit);
  const back = inList || inGroup || inPlace || inPerson;
  $('#backBtn').classList.toggle('hidden', !back); $('#backBtn').classList.toggle('grid', !!back);
  $('#main').innerHTML = { tasks: renderTasks, places: renderPlaces, family: renderFamily }[state.tab]();
  $('#offline').classList.toggle('hidden', !state.offline); $('#offline').classList.toggle('inline-flex', !!state.offline);
  $('#familyBar').classList.toggle('hidden', state.tab !== 'family' || !!state.personView);
  $('#familyBar').innerHTML = `<button class="${PRIMARY} w-full !h-12 text-base" data-invite>${icon('person_add')}Invite member</button>`;
  renderDock(); renderComposer(); renderDetail();
}

/* ---- Behaviour ----------------------------------------------------------------------------- */
function setExtras(open) { $('#extras').classList.toggle('hidden', !open); $('#extras').classList.toggle('flex', open); }
$('#addInput').addEventListener('focus', () => setExtras(true));
$('#addInput').addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== $('#addInput')) setExtras(false); }, 150));
$('#composer').addEventListener('mousedown', (e) => { if (e.target.closest('#extras')) e.preventDefault(); });
$('#addInput').addEventListener('input', (e) => { const has = !!e.target.value.trim(); $('#addBtn').classList.toggle('hidden', !has); $('#addBtn').classList.toggle('grid', has); if (barMode() === 'place' || barMode() === 'location') renderExtras(); });

function addTask(title) {
  const list = state.tab === 'tasks' && state.listView ? state.listView : 'other';
  const t = { id: now(), title, list, places: [...state.chosen], status: 'open', sessions: [] };
  state.tasks.push(t);
  state.chosen = new Set(state.placeView ? [state.placeView] : []);
  render();
  toast(`Added ${title}`, 'Undo', () => { state.tasks.splice(state.tasks.indexOf(t), 1); render(); });
}
function addList(name) {
  const l = { id: `l${now()}`, name };
  state.lists.push(l); render();
  toast(`Added ${name}`, 'Undo', () => { state.lists.splice(state.lists.indexOf(l), 1); render(); });
}
function addGroup(name) {
  const g = { id: `g${now()}`, name };
  state.groups.push(g); render();
  toast(`Added ${name}`, 'Undo', () => { state.groups.splice(state.groups.indexOf(g), 1); render(); });
}
function addPlace(name, address) {
  const p = { id: `p${now()}`, group: state.groupView, name, locations: [{ name, address: address ?? name }] };
  state.places.push(p); render();
  toast(`Added ${name}`, 'Undo', () => { state.places.splice(state.places.indexOf(p), 1); render(); });
}
function addLocation(name, address) {
  const p = placeById(state.placeView), l = { name, address: address ?? name };
  p.locations.push(l); render();
  toast(`Added ${name}`, 'Undo', () => { p.locations.splice(p.locations.indexOf(l), 1); render(); });
}
function clearBar() { $('#addInput').value = ''; $('#addBtn').classList.add('hidden'); $('#addBtn').classList.remove('grid'); renderExtras(); $('#addInput').focus(); }
$('#addForm').addEventListener('submit', (e) => {
  e.preventDefault(); const v = $('#addInput').value.trim(); if (!v) return;
  ({ list: addList, group: addGroup, task: addTask, place: addPlace, location: addLocation })[barMode()](v); clearBar();
});

/* Finishing: the check pops, the card slides away and folds up, the toast offers Undo. */
function finish(t, card) {
  for (const s of t.sessions) s.to ??= now();
  t.on = null;
  const done = () => { t.status = 'done'; if (!state.recent.includes(t.title)) state.recent.unshift(t.title); render(); };
  if (card && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setTimeout(() => card.classList.add('opacity-0', 'translate-x-8'), 250);
    setTimeout(() => card.classList.add('!max-h-0', '!mb-0'), 450);
    setTimeout(done, 750);
  } else done();
  toast(`${t.title} done`, 'Undo', () => { t.status = 'open'; render(); });
}

document.addEventListener('input', (e) => { if (e.target.id === 'placeName') { placeById(state.placeView).name = e.target.value; } });
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'nameForm') return;
  e.preventDefault();
  const name = $('#nameInput').value.trim(), { kind, id } = e.target.dataset;
  $('#sheet').close();
  if (!name) return;
  if (id) { (kind === 'list' ? listById(id) : state.groups.find((g) => g.id === id)).name = name; render(); }
  else if (kind === 'list') addList(name);
  else { // a new group from Edit place: the place moves into it
    const g = { id: `g${now()}`, name }; state.groups.push(g); placeById(state.placeView).group = g.id; render();
  }
});
document.addEventListener('change', (e) => {
  const id = e.target.dataset.check; if (!id) return;
  finish(find(id), e.target.closest('[data-card]'));
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.closest('#toasts')) return;
  const d = b.dataset;
  if (b.id === 'backBtn') { if (state.listView && state.tab === 'tasks') state.listView = null; else if (state.personView) state.personView = null; else if (state.editPlace) state.editPlace = false; else if (state.placeView) { state.placeView = null; state.chosen = new Set(); } else state.groupView = null; }
  else if (b.id === 'editBtn' && state.tab === 'tasks' && state.listView) { nameSheet('list', state.listView); return; }
  else if (b.id === 'editBtn' && state.tab === 'places' && state.groupView && !state.placeView) { nameSheet('group', state.groupView); return; }
  else if (d.openGroup) { state.groupView = d.openGroup; }
  else if (b.id === 'editBtn' && state.personView) { avatarSheet(); return; }
  else if (b.id === 'editBtn' || 'editPlace' in d) { state.editPlace = true; }
  else if (d.person) { state.personView = d.person; }
  else if ('newList' in d) { nameSheet('list'); return; }
  else if (d.openList) { state.listView = d.openList; }
  else if (d.rename) { nameSheet(d.rename, d.id); return; }
  else if ('closeSheet' in d) { $('#sheet').close(); return; }
  else if (d.delete) {
    if (d.delete === 'list') { state.lists = state.lists.filter((l) => l.id !== d.id); state.listView = null; }
    else { state.groups = state.groups.filter((g) => g.id !== d.id); state.groupView = null; }
    $('#sheet').close();
  }
  else if ('group' in d && state.editPlace) { placeById(state.placeView).group = d.group || null; }
  else if ('newGroup' in d) { nameSheet('group'); return; }
  else if (d.assign) {
    const t = find(d.assign);
    const people = [...state.members].sort((a, b) => b.me - a.me);
    sheet(`<h2 class="text-xl font-semibold">Who does “${t.title}”?</h2>
      <ul class="mt-4 -mx-2">${people.map((m) => `<li><button class="w-full flex items-center gap-4 px-2 min-h-14 rounded-lg text-left hover:bg-stone-100" data-assign-to="${m.id}" data-task="${t.id}">
        ${avatar(m)}<span class="text-base">${m.me ? 'Me' : m.name}</span></button></li>`).join('')}</ul>`); return;
  }
  else if (d.assignTo) {
    const t = find(d.task), m = member(d.assignTo);
    Object.assign(t, { on: m.id, by: 'p', sessions: [] });
    $('#sheet').close();
    toast(m.me ? `You took ${t.title}` : `${t.title} is now ${m.name}’s`, 'Undo', () => { Object.assign(t, { on: null, by: null }); render(); });
  }
  else if (d.filter) { state.filter = d.filter; try { localStorage.setItem('tackly-filter', d.filter); } catch {} }
  else if (d.removeLocation) {
    const p = placeById(state.placeView), [l] = p.locations.splice(+d.removeLocation, 1);
    toast(`Removed ${l.name}`, 'Undo', () => { p.locations.splice(+d.removeLocation, 0, l); render(); });
  }
  else if (d.tab) { state.tab = d.tab; state.listView = null; state.groupView = null; state.placeView = null; state.personView = null; state.editPlace = false; state.chosen = new Set(); }
  else if (d.place) { state.placeView = d.place; state.chosen = new Set([d.place]); }
  else if (d.chip) { state.chosen.has(d.chip) ? state.chosen.delete(d.chip) : state.chosen.add(d.chip); renderExtras(); return; }
  else if (d.suggest) { addTask(d.suggest); return; }
  else if (d.found) { const f = FOUND[+d.found]; (barMode() === 'location' ? addLocation : addPlace)(f.name, f.address); clearBar(); return; }
  else if (d.open) { state.detail = +d.open; }
  else if ('closeDetail' in d) { state.detail = null; }
  else if (d.toggleRun) {
    const t = find(d.toggleRun);
    if (running(t)) { t.sessions.forEach((s) => (s.to ??= now())); }
    else { t.sessions.push({ from: now() }); t.on = 'p'; }
  }
  else if (d.finishDetail) { state.detail = null; finish(find(d.finishDetail)); return; }
  else if ('avatar' in d) { avatarSheet(); return; }
  else if (d.pick) { const me = state.members.find((m) => m.me); me.avatar = { icon: d.pick, tint: +d.tint }; $('#sheet').close(); }
  else if ('invite' in d) {
    sheet(`<div class="flex flex-col items-center gap-5 text-center"><h2 class="text-xl font-semibold">Invite member</h2>${qrSvg()}
      <p class="text-sm text-stone-600">Scan with the other phone, or send the link.<br>Works once, for 5 minutes.</p>
      <button class="${PRIMARY}" data-copy>${icon('content_copy', '!text-[18px]')}Copy link</button></div>`); return;
  }
  else if ('copy' in d) { toast('Link copied'); return; }
  else return;
  render();
});

/* Page backgrounds: a strong pastel sky over a simple drawn landscape (inline SVG, no photos, no sun).
   Waves and clouds drift slowly; motion-safe, so they stop when the phone asks for less motion. */
const W = (d, fill, op = 1) => `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
const svg = (body) => `<svg viewBox="0 0 430 320" preserveAspectRatio="xMidYMax slice" class="size-full">${body}</svg>`;
const drift = (speed, body) => `<g class="motion-safe:animate-drift-${speed}">${body}</g>`;
const waves = (a, b, c) => svg(
    drift('far', `<path d="M90 70 q8 -7 16 0 q8 -7 16 0 M140 50 q6 -5 12 0 q6 -5 12 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".8"/>`)
  + drift('far', W('M-40 190 C30 178 110 200 180 190 S320 178 470 192 V320 H-40Z', a))
  + drift('mid', W('M-40 230 C40 213 140 240 210 228 S360 213 470 232 V320 H-40Z', b, .8))
  + drift('near', W('M-40 275 C60 258 160 285 240 272 S380 260 470 278 V320 H-40Z', c, .6)));
const slopes = (a, b, c) => svg(
    W('M0 215 C110 170 200 230 300 200 S400 175 430 185 V320 H0Z', a)
  + W('M0 255 C90 230 190 270 280 245 S390 230 430 240 V320 H0Z', b, .85)
  + W('M0 295 C120 275 230 300 330 285 S410 280 430 284 V320 H0Z', c, .6));
const peaks = (a, b, c) => svg(W('M0 230 L70 140 L120 190 L190 90 L260 180 L310 130 L430 230 V320 H0Z', a)
  + W('M190 90 L212 118 L200 114 L190 124 L180 113 L170 116Z', '#ffffff', .95)
  + W('M0 260 L90 190 L160 240 L240 170 L330 245 L380 210 L430 250 V320 H0Z', b, .85)
  + W('M0 290 C110 265 220 275 430 280 V320 H0Z', c, .6));
const pines = (y, h, n, fill, op, seed) => Array.from({ length: n }, (_, i) => {
  const x = (i + 0.5) * (430 / n) + ((i * seed) % 17) - 8, t = h * (0.75 + ((i * seed) % 5) / 10);
  return W(`M${x} ${y - t} L${x + t * 0.32} ${y} L${x - t * 0.32} ${y} Z`, fill, op);
}).join('');
const woods = (a, b, c) => svg(pines(250, 110, 9, a, 1, 7) + pines(285, 95, 11, b, .85, 5) + pines(320, 80, 13, c, .6, 3));
const fjord = (a, b, water) => svg(W('M0 210 L60 120 L110 170 L180 80 L250 160 L320 110 L430 200 V250 H0Z', a)
  + W('M180 80 L200 106 L189 102 L180 112 L171 101 L162 104Z', '#ffffff', .95)
  + W('M0 235 L80 180 L150 225 L230 165 L320 230 L430 210 V260 H0Z', b, .85)
  + drift('mid', W('M-40 250 H470 V320 H-40Z', water, .8))
  + drift('near', `<g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M150 272 h120"/><path d="M175 292 h70"/></g>`));
const clouds = (fill) => svg([[70, 90, 1, 'far'], [300, 60, .8, 'mid'], [220, 170, 1.2, 'near'], [60, 230, .9, 'mid'], [360, 250, 1, 'far']].map(([x, y, k, speed]) =>
  drift(speed, `<g transform="translate(${x} ${y}) scale(${k})" fill="${fill}"><circle cx="0" cy="0" r="18"/><circle cx="20" cy="-8" r="22"/><circle cx="42" cy="0" r="16"/><rect x="0" y="-2" width="42" height="18" rx="9"/></g>`)).join(''));

/* Accent palettes (Tailwind's own shades). White text passes 4.5:1 on every 700.
   Each background gets an accent from across the colour wheel (complementary or split-complementary), in a deep shade
   against a pale sky: the accent stands out, and the strong lightness contrast is what people rate best for colour pairs
   (Schloss & Palmer 2011). */
const ACCENT = {
  sky: ['#f0f9ff', '#e0f2fe', '#bae6fd', '#0369a1', '#075985', '#0c4a6e'],
  pink: ['#fdf2f8', '#fce7f3', '#fbcfe8', '#be185d', '#9d174d', '#831843'],
  violet: ['#f5f3ff', '#ede9fe', '#ddd6fe', '#6d28d9', '#5b21b6', '#4c1d95'],
  emerald: ['#ecfdf5', '#d1fae5', '#a7f3d0', '#047857', '#065f46', '#064e3b'],
  green: ['#f0fdf4', '#dcfce7', '#bbf7d0', '#15803d', '#166534', '#14532d'],
  teal: ['#f0fdfa', '#ccfbf1', '#99f6e4', '#0f766e', '#115e59', '#134e4a'],
  blue: ['#eff6ff', '#dbeafe', '#bfdbfe', '#1d4ed8', '#1e40af', '#1e3a8a'],
  fuchsia: ['#fdf4ff', '#fae8ff', '#f5d0fe', '#a21caf', '#86198f', '#701a75'],
  indigo: ['#eef2ff', '#e0e7ff', '#c7d2fe', '#4338ca', '#3730a3', '#312e81'],
  amber: ['#fffbeb', '#fef3c7', '#fde68a', '#b45309', '#92400e', '#78350f'],
  rose: ['#fff1f2', '#ffe4e6', '#fecdd3', '#be123c', '#9f1239', '#881337'],
  lime: ['#f7fee7', '#ecfccb', '#d9f99d', '#4d7c0f', '#3f6212', '#365314'],
};
const accentClasses = (name) => ACCENT[name].map((hex, i) => `[--color-accent-${['50', '100', '200', '700', '800', '900'][i]}:${hex}]`).join(' ');

const BACKGROUNDS = {
  ocean:      { sky: 'bg-linear-to-b from-sky-200 to-cyan-100', accent: 'rose',       scene: waves('#7dd3fc', '#38bdf8', '#0ea5e9') },
  sunset:     { sky: 'bg-linear-to-b from-orange-200 to-rose-200', accent: 'sky',    scene: slopes('#fdba74', '#fb923c', '#f97316') },
  lavender:   { sky: 'bg-linear-to-b from-violet-200 to-indigo-100', accent: 'lime',  scene: peaks('#c4b5fd', '#a78bfa', '#8b5cf6') },
  pinewood:   { sky: 'bg-linear-to-b from-emerald-200 to-teal-100', accent: 'pink',   scene: woods('#6ee7b7', '#34d399', '#10b981') },
  spring:     { sky: 'bg-linear-to-b from-lime-200 to-emerald-100', accent: 'violet',   scene: slopes('#bef264', '#a3e635', '#84cc16') },
  lagoon:     { sky: 'bg-linear-to-b from-teal-200 to-cyan-100', accent: 'fuchsia',      scene: waves('#5eead4', '#2dd4bf', '#14b8a6') },
  glacier:    { sky: 'bg-linear-to-b from-sky-200 to-indigo-100', accent: 'amber',     scene: peaks('#bae6fd', '#7dd3fc', '#38bdf8') },
  heather:    { sky: 'bg-linear-to-b from-fuchsia-200 to-pink-100', accent: 'green',   scene: slopes('#f0abfc', '#e879f9', '#d946ef') },
  fjord:      { sky: 'bg-linear-to-b from-indigo-200 to-sky-100', accent: 'amber',     scene: fjord('#a5b4fc', '#818cf8', '#7dd3fc') },
  jungle:     { sky: 'bg-linear-to-b from-lime-200 to-green-100', accent: 'fuchsia',     scene: woods('#86efac', '#4ade80', '#22c55e') },
  canyon:     { sky: 'bg-linear-to-b from-amber-200 to-orange-100', accent: 'indigo',   scene: peaks('#fcd34d', '#fbbf24', '#f59e0b') },
  rose:       { sky: 'bg-linear-to-b from-rose-200 to-pink-100', accent: 'teal',      scene: slopes('#fda4af', '#fb7185', '#f43f5e') },
  seafoam:    { sky: 'bg-linear-to-b from-emerald-200 to-cyan-100', accent: 'rose',   scene: waves('#6ee7b7', '#34d399', '#10b981') },
  clouds:     { sky: 'bg-linear-to-b from-sky-100 to-sky-50', accent: 'pink',         scene: clouds('#ffffff') },
  blueclouds: { sky: 'bg-linear-to-b from-sky-300 to-sky-100', accent: 'amber',        scene: clouds('#ffffff') },
  slate:      { sky: 'bg-linear-to-b from-slate-200 to-slate-100', accent: 'fuchsia', scene: '' }, // plain and calm; a neutral sky takes any accent, so the app's fuchsia
};
const APP = 'fixed inset-0 mx-auto max-w-[430px] flex flex-col overflow-hidden';
function setBackground(name) {
  const bg = BACKGROUNDS[name] ?? BACKGROUNDS.ocean;
  $('#app').className = `${APP} ${bg.sky} ${accentClasses(bg.accent)}`;
  $('#scene').innerHTML = bg.scene;
  try { localStorage.setItem('tackly-bg', name); } catch {}
  $('#bgSwitcher [role=radiogroup]').innerHTML = Object.entries(BACKGROUNDS).map(([n, b]) => `
    <button role="radio" aria-checked="${n === name}" data-bg="${n}" class="flex flex-col items-center gap-1 text-xs">
      <span class="relative w-16 h-20 rounded-lg overflow-hidden border ${n === name ? 'ring-2 ring-stone-800 ring-offset-1' : 'border-stone-200'} ${b.sky}"><span class="absolute inset-x-0 bottom-0 h-1/2">${b.scene}</span></span>${n}</button>`).join('');
}
$('#bgSwitcher').addEventListener('click', (e) => { const b = e.target.closest('[data-bg]'); if (b) setBackground(b.dataset.bg); });
let savedBg = null; try { savedBg = localStorage.getItem('tackly-bg'); } catch {}
setBackground(new URLSearchParams(location.search).get('bg') || savedBg || 'ocean');

// ?bg=dots, ?tab=places, ?tab=places&place=lidl, ?offline=1, ?empty=1, ?typing=text, ?task=6, ?task=6&run=1, ?sheet=invite|avatar, ?toasts=3, ?fan=1
const query = new URLSearchParams(location.search);
if (query.get('tab')) state.tab = query.get('tab');
if (query.get('group')) state.groupView = query.get('group');
if (query.get('place')) { state.groupView = placeById(query.get('place')).group; state.placeView = query.get('place'); state.chosen = new Set([state.placeView]); state.editPlace = query.has('edit'); }
state.offline = query.has('offline');
if (query.has('empty')) { state.tasks = []; state.places = []; state.groups = []; }
if (query.get('task')) { state.detail = +query.get('task'); if (query.get('run')) { find(state.detail).sessions.push({ from: now() - 7 * MIN }); find(state.detail).on = 'p'; } }
if (query.get('filter')) state.filter = query.get('filter');
if (query.get('list')) state.listView = query.get('list');
if (query.get('rename')) { render(); nameSheet(...query.get('rename').split(':')); }
if (query.has('assign')) { state.listView ??= 'home'; state.filter = 'all'; render(); document.querySelector('[data-assign]').click(); }
if (query.has('mine')) { const t = find(6); t.on = 'p'; t.sessions.push({ from: now() - 3 * MIN }); }
render();
if (query.has('typing')) { $('#addInput').value = query.get('typing'); $('#addInput').focus(); $('#addInput').dispatchEvent(new Event('input')); }
if (query.get('sheet') === 'invite') { state.tab = 'family'; render(); document.querySelector('[data-invite]').click(); }
if (query.get('sheet') === 'avatar') { state.tab = 'family'; render(); avatarSheet(); }
if (query.get('person')) { state.tab = 'family'; state.personView = query.get('person'); render(); }
if (query.get('toasts')) {
  ['Milk', 'Bread', 'Light bulbs'].slice(0, +query.get('toasts')).forEach((title) => finish(find(state.tasks.find((t) => t.title === title).id)));
  toasts.forEach((t) => (t.left = 1e9));
  if (query.has('fan')) setTimeout(() => { fanned = true; layoutToasts(); }, 50);
}
</script>
</body>
</html>
