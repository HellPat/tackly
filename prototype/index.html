<!doctype html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tackly prototype</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/themes.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
</head>
<body class="bg-neutral">
  <!-- Plain daisyUI, built-in "emerald" theme. Full screen on a phone; a phone-sized column on a desktop. -->
  <div id="app" class="fixed inset-0 mx-auto max-w-[430px] bg-base-100 flex flex-col">

    <div class="navbar bg-base-100 shadow-sm">
      <div class="flex-1 px-2">
        <div>
          <div class="text-xl font-semibold">Tackly</div>
          <div class="text-xs opacity-60">The Smiths · 3 members</div>
        </div>
      </div>
      <span class="badge badge-success badge-soft">Live</span>
    </div>

    <main id="main" class="flex-1 overflow-y-auto"></main>

    <!-- Add a task -->
    <div id="composer" class="border-t border-base-300 bg-base-100 p-2 flex flex-col gap-2">
      <div id="placeChips" class="flex gap-2 overflow-x-auto"></div>
      <div id="suggestions" class="flex gap-2 overflow-x-auto"></div>
      <form id="addForm" class="flex items-center gap-2">
        <input id="addInput" aria-label="Add a task" placeholder="Add a task" autocomplete="off" class="input flex-1">
        <button id="addBtn" aria-label="Add" class="btn btn-primary btn-circle" disabled>↑</button>
      </form>
    </div>

    <div id="dock" class="dock dock-sm static border-t border-base-300"></div>

    <dialog id="finishSheet" class="modal modal-bottom">
      <div class="modal-box">
        <h3 class="text-lg font-semibold">Finish “<span id="finishTitle"></span>”</h3>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Note (optional)</legend>
          <input id="finishNote" class="input w-full">
        </fieldset>
        <label class="label cursor-pointer justify-start gap-3">
          <input type="checkbox" class="toggle toggle-primary" checked> Add where I am
        </label>
        <div class="modal-action">
          <form method="dialog"><button class="btn btn-ghost">Cancel</button></form>
          <button id="finishDone" class="btn btn-primary">Done</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <div id="toast" class="toast toast-center hidden mb-40"><div class="alert alert-info"><span id="toastText"></span></div></div>
  </div>

<script>
const $ = (s) => document.querySelector(s);
const state = {
  tab: 'tasks', placeView: null, chosen: new Set(),
  groups: [{ id: 'g1', name: 'Grocery Store', emoji: '🛒' }, { id: 'g2', name: 'Hardware', emoji: '🔨' }],
  places: [
    { id: 'lidl', group: 'g1', name: 'LIDL', emoji: '🏪', loc: 'Marbacher Straße 1, 71364 Winnenden', more: 1 },
    { id: 'aldi', group: 'g1', name: 'Aldi', emoji: '🏬', loc: 'Aldi Waiblingen', more: 0 },
    { id: 'bauhaus', group: 'g2', name: 'Bauhaus', emoji: '🔧', loc: 'Stuttgarter Straße 9, 71522 Backnang', more: 0 },
  ],
  tasks: [
    { id: 1, title: 'Milk', emoji: '🥛', places: ['lidl', 'aldi'], status: 'open' },
    { id: 2, title: 'Bread', emoji: '🍞', places: ['lidl'], status: 'open' },
    { id: 3, title: 'Light bulbs', emoji: '💡', places: ['bauhaus'], status: 'open' },
    { id: 4, title: 'Water the plants', emoji: '🪴', places: [], status: 'doing', by: 'Mona' },
    { id: 5, title: 'Altglas leeren', emoji: '🗑', places: [], status: 'done', by: 'Mara', note: 'Both containers', took: '12 min' },
  ],
  conflict: true,
};
const placeById = (id) => state.places.find((p) => p.id === id);
const openCount = (p) => state.tasks.filter((t) => t.status !== 'done' && t.places.includes(p.id)).length;
const header = (text) => `<li class="p-4 pb-2 text-xs opacity-60 tracking-wide uppercase">${text}</li>`;

function toast(text) { $('#toastText').textContent = text; $('#toast').classList.remove('hidden'); setTimeout(() => $('#toast').classList.add('hidden'), 2000); }

function taskRow(t) {
  const badges = t.places.map((id) => `<span class="badge badge-sm badge-soft badge-primary">${placeById(id).emoji} ${placeById(id).name}</span>`).join(' ');
  const sub = t.status === 'doing' ? `${t.by} is on it · started 4 min ago`
    : t.status === 'done' ? `Done by ${t.by} · 2 h ago · ⏱ ${t.took} · 💬 ${t.note}` : '';
  const actions = t.status === 'done'
    ? `<button class="btn btn-sm btn-ghost" data-reopen="${t.id}">Reopen</button>`
    : `${t.status === 'open' ? `<button class="btn btn-sm btn-soft" data-start="${t.id}">Start</button>` : ''}
       <button class="btn btn-sm btn-primary" data-finish="${t.id}">Finish</button>`;
  return `<li class="list-row items-center ${t.status === 'doing' ? 'bg-base-200' : ''}">
    <div class="text-2xl">${t.emoji}</div>
    <div class="list-col-grow">
      <div class="${t.status === 'done' ? 'line-through opacity-60' : ''}">${t.title}</div>
      ${sub ? `<div class="text-xs opacity-60">${sub}</div>` : ''}
      ${badges ? `<div class="flex flex-wrap gap-1 mt-1">${badges}</div>` : ''}
    </div>
    <div class="flex gap-1">${actions}</div>
  </li>`;
}

function renderTasks() {
  const todo = state.tasks.filter((t) => t.status !== 'done').sort((a, b) => (b.status === 'doing') - (a.status === 'doing'));
  const done = state.tasks.filter((t) => t.status === 'done');
  return `${state.conflict ? `<div class="p-4 pb-0"><div role="alert" class="alert alert-warning alert-soft flex-col items-start">
      <div><b>🐱 Feed the cat</b> was finished twice. Only Mona and Mara can decide.</div>
      <div class="flex gap-2 flex-wrap"><button class="btn btn-sm" data-keep>Keep Mona’s</button><button class="btn btn-sm" data-keep>Keep Mara’s</button></div></div></div>` : ''}
    <ul class="list">${header('To do')}${todo.map(taskRow).join('')}${header('Done')}${done.map(taskRow).join('')}</ul>`;
}

function renderPlaces() {
  if (state.placeView) {
    const p = placeById(state.placeView);
    const tasks = state.tasks.filter((t) => t.status !== 'done' && t.places.includes(p.id));
    return `<div class="p-2 flex items-center gap-1"><button class="btn btn-ghost btn-circle" data-back aria-label="Back">←</button><h2 class="text-lg font-semibold">${p.emoji} ${p.name}</h2></div>
      <div class="px-4 pb-2 text-sm opacity-70">📍 ${p.loc}${p.more ? ` · +${p.more} more` : ''}<br><button class="btn btn-sm btn-ghost px-0">Add location</button></div>
      <ul class="list">${header('To get here')}${tasks.length ? tasks.map(taskRow).join('') : '<li class="p-4 opacity-60">Nothing to get here.</li>'}</ul>`;
  }
  return `<ul class="list">${state.groups.map((g) => {
    const places = state.places.filter((p) => p.group === g.id).sort((a, b) => openCount(b) - openCount(a));
    return `${header(`${g.emoji} ${g.name}`)}
      ${places.map((p) => `<li class="list-row items-center cursor-pointer" data-place="${p.id}">
        <div class="text-2xl">${p.emoji}</div>
        <div class="list-col-grow"><div>${p.name}</div><div class="text-xs opacity-60">${p.loc}${p.more ? ` · +${p.more} more` : ''}</div></div>
        <span class="badge badge-primary" aria-label="${openCount(p)} to get">${openCount(p)}</span></li>`).join('')}`;
  }).join('')}</ul>
  <div class="p-4 flex gap-2"><button class="btn btn-soft">New group</button><button class="btn btn-soft">Add place</button></div>`;
}

function renderActivity() {
  const rows = [['✅', 'Mara finished “Altglas leeren”', '2 h ago'], ['▶️', 'Mona started “Water the plants”', '4 min ago'], ['➕', 'You added “Milk”', '1 h ago'], ['👋', 'Mara joined the family', 'yesterday'], ['🌱', 'You created The Smiths', 'yesterday']];
  return `<ul class="list">${rows.map(([i, t, a]) => `<li class="list-row items-center"><div class="text-2xl">${i}</div><div class="list-col-grow">${t}<div class="text-xs opacity-60">${a}</div></div></li>`).join('')}</ul>`;
}

function renderFamily() {
  const cells = Array.from({ length: 21 * 21 }, (_, i) => { const x = i % 21, y = Math.floor(i / 21); const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13); return finder ? (x % 6 === 0 || y % 6 === 0 || (x % 6 > 1 && x % 6 < 5 && y % 6 > 1 && y % 6 < 5)) : ((i * 7919) >> 2) % 3 === 0; });
  return `<ul class="list">${header('Members')}
    <li class="list-row items-center"><div class="avatar avatar-placeholder"><div class="bg-primary text-primary-content w-10 rounded-full">P</div></div><div class="list-col-grow">Patrick (you)<div class="text-xs opacity-60">Head of the family</div></div></li>
    <li class="list-row items-center"><div class="avatar avatar-placeholder"><div class="bg-primary text-primary-content w-10 rounded-full">M</div></div><div class="list-col-grow">Mona</div></li>
    <li class="list-row items-center"><div class="avatar avatar-placeholder"><div class="bg-primary text-primary-content w-10 rounded-full">M</div></div><div class="list-col-grow">Mara</div></li>
    ${header('Invite someone')}</ul>
    <div class="px-4 flex flex-col items-center gap-3">
      <p class="text-sm opacity-70 text-center">Let the other phone scan this code, or copy the link and send it by message. It expires in 5 minutes.</p>
      <div class="bg-white p-2 border border-base-300 rounded-box" role="img" aria-label="Invitation QR code"><div class="grid" style="grid-template-columns:repeat(21,8px)">${cells.map((b) => `<i class="size-2 ${b ? 'bg-black' : 'bg-white'}"></i>`).join('')}</div></div>
      <button class="btn btn-primary" data-copy>Copy link</button>
    </div>`;
}

function renderDock() {
  const items = [['tasks', '✓', 'Tasks'], ['places', '📍', 'Places'], ['activity', '🕘', 'Activity'], ['family', '👪', 'Family']];
  $('#dock').innerHTML = items.map(([id, icon, label]) => `<button data-tab="${id}" class="${state.tab === id ? 'dock-active' : ''}"><span class="text-xl">${icon}</span><span class="dock-label">${label}</span></button>`).join('');
}

function renderComposer() {
  const show = state.tab === 'tasks' || (state.tab === 'places' && state.placeView);
  $('#composer').classList.toggle('hidden', !show);
  $('#placeChips').innerHTML = state.places.map((p) => `<button type="button" data-chip="${p.id}" aria-pressed="${state.chosen.has(p.id)}" class="btn btn-xs shrink-0 ${state.chosen.has(p.id) ? 'btn-primary' : 'btn-outline'}">${p.emoji} ${p.name}</button>`).join('');
  const suggestions = state.tasks.filter((t) => t.status === 'done').map((t) => t.title).slice(0, 6);
  $('#suggestions').innerHTML = suggestions.map((s) => `<button type="button" data-suggest="${s}" class="btn btn-sm btn-soft shrink-0">+ ${s}</button>`).join('');
}

function render() {
  $('#main').innerHTML = { tasks: renderTasks, places: renderPlaces, activity: renderActivity, family: renderFamily }[state.tab]();
  renderDock(); renderComposer();
}

function addTask(title, places) {
  state.tasks.push({ id: Date.now(), title, emoji: '✅', places: [...places], status: 'open' });
  state.chosen = new Set(state.placeView ? [state.placeView] : []);
  render();
}

let finishing = null;
document.addEventListener('click', (e) => {
  const row = e.target.closest('[data-place]');
  const button = e.target.closest('button');
  const d = (button || row || {}).dataset; if (!d) return;
  if (d.tab) { state.tab = d.tab; state.placeView = null; state.chosen = new Set(); }
  else if (d.place && !button) { state.placeView = d.place; state.chosen = new Set([d.place]); }
  else if ('back' in d) { state.placeView = null; state.chosen = new Set(); }
  else if (d.chip) { state.chosen.has(d.chip) ? state.chosen.delete(d.chip) : state.chosen.add(d.chip); }
  else if (d.suggest) { addTask(d.suggest, state.chosen); return; }
  else if (d.start) { const t = state.tasks.find((x) => x.id == d.start); t.status = 'doing'; t.by = 'You'; }
  else if (d.finish) { finishing = state.tasks.find((x) => x.id == d.finish); $('#finishTitle').textContent = finishing.title; $('#finishSheet').showModal(); return; }
  else if (d.reopen) { state.tasks.find((x) => x.id == d.reopen).status = 'open'; }
  else if ('copy' in d) { toast('Link copied'); return; }
  else if ('keep' in d) { state.conflict = false; toast('Settled'); }
  else return;
  render();
});
$('#finishDone').addEventListener('click', () => { Object.assign(finishing, { status: 'done', by: 'You', note: $('#finishNote').value || 'Done', took: '3 min' }); $('#finishSheet').close(); render(); });
$('#addInput').addEventListener('input', (e) => { $('#addBtn').disabled = !e.target.value.trim(); });
$('#addForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#addInput').value.trim(); if (!v) return; addTask(v, state.chosen); $('#addInput').value = ''; $('#addBtn').disabled = true; $('#addInput').focus(); });

// ?tab=places  or  ?tab=places&place=lidl  opens that screen directly
const query = new URLSearchParams(location.search);
if (query.get('tab')) state.tab = query.get('tab');
if (query.get('place')) { state.placeView = query.get('place'); state.chosen = new Set([state.placeView]); }
render();
</script>
</body>
</html>
