<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tackly Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <!-- Same look as prototype/index.html: font, accent, animations. Plus confetti for the celebration. -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: Roboto, system-ui, sans-serif;
      --color-accent-50: #fdf4ff;
      --color-accent-100: #fae8ff;
      --color-accent-200: #f5d0fe;
      --color-accent-700: #a21caf;
      --color-accent-800: #86198f;
      --color-accent-900: #701a75;
      --color-accent-ink: #ffffff;
      --animate-pop: pop .3s ease-out;
      --animate-drift-far: drift 40s ease-in-out infinite alternate;
      --animate-drift-mid: drift 28s ease-in-out infinite alternate;
      --animate-drift-near: drift 18s ease-in-out infinite alternate;
      --animate-fall: fall 3.2s ease-in forwards;
      --animate-hop: hop 1.6s ease-in-out infinite;
      --animate-rise: rise .45s ease-out;
      @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
      @keyframes pop { 40% { transform: scale(1.3); } }
      @keyframes fall { from { transform: translateY(-10vh) rotate(0); opacity: 1; } to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }
      @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 60% { transform: translateY(-14px); } }
      @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    }
  </style>
  <!-- Light only, by decision (the app has no dark mode). -->
  <style>html, body { height: 100%; background: #d6d3d1; color-scheme: light; }</style>
</head>
<body class="bg-stone-300 text-stone-800 antialiased">
  <div id="app" class="fixed inset-0 mx-auto max-w-[430px] flex flex-col overflow-hidden pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
    <div id="scene" class="absolute inset-x-0 bottom-20 h-[42%] pointer-events-none" aria-hidden="true"></div>

    <header class="relative z-10 shrink-0 flex items-center gap-1 px-2 h-16">
      <button id="backBtn" class="hidden size-12 place-items-center rounded-full text-stone-700 hover:bg-stone-200/60" aria-label="Back"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span></button>
      <h1 id="title" class="flex-1 px-2 text-2xl font-semibold tracking-tight truncate">Today</h1>
      <span id="subtitle" class="mr-1 text-sm text-stone-600"></span>
      <!-- The family lives behind my picture, top right. -->
      <button id="editBtn" class="hidden size-12 place-items-center rounded-full text-stone-700 hover:bg-stone-200/60" aria-label="Edit problem"><span class="material-symbols-rounded" aria-hidden="true">edit</span></button>
      <button id="meBtn" class="size-12 grid place-items-center rounded-full" aria-label="Family and settings"></button>
    </header>

    <main id="main" class="relative z-10 flex-1 min-h-0 overflow-y-auto px-3 pb-6"></main>

    <!-- Problems: the one main action, right above the navigation. -->
    <section id="problemBar" class="hidden relative z-10 shrink-0 px-3 pb-3 pt-2" aria-label="Report a problem">
      <button class="" data-something-wrong>Something’s wrong</button>
    </section>

    <!-- Plan mode: the only ways out, at the bottom like every main action. -->
    <section id="planBar" class="hidden relative z-10 shrink-0 px-3 pb-3 pt-2 flex-col gap-2" aria-label="Plan">
      <button class="" data-plan-later>Plan later</button>
      <button class="" data-plan-done>Save plan</button>
    </section>

    <nav id="dock" class="relative z-10 shrink-0 h-20 grid grid-cols-4 bg-[#fffdfb] shadow-[0_-1px_0_var(--color-stone-200)]" aria-label="Main"></nav>

    <!-- Full screen, no navigation: the shopping trip and the celebration. -->
    <section id="full" class="hidden absolute inset-0 z-40 flex-col"></section>

    <!-- A bottom sheet; a tap on the dimmed backdrop closes it. -->
    <dialog id="sheet" class="mx-auto mb-0 mt-auto w-full max-w-[430px] max-h-[85dvh] rounded-t-[28px] bg-[#fffdfb] text-stone-800 px-6 pt-3 pb-[calc(2rem+env(safe-area-inset-bottom))] shadow-2xl backdrop:bg-stone-900/40">
      <div class="mx-auto mb-5 h-1 w-8 rounded-full bg-stone-300"></div>
      <div id="sheetBody"></div>
    </dialog>

    <section id="toasts" class="absolute inset-x-4 bottom-28 z-50 h-0" aria-label="Notifications" aria-live="polite"></section>
  </div>

<script>
const $ = (s) => document.querySelector(s);
const icon = (name, cls = '') => `<span class="material-symbols-rounded ${cls}" aria-hidden="true">${name}</span>`;
const FILL = "[font-variation-settings:'FILL'_1]";

const BTN = 'inline-flex items-center justify-center gap-2 h-10 px-4 rounded-md border font-semibold shadow-sm transition-colors active:shadow-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-700';
const PRIMARY = `${BTN} border-accent-800 bg-accent-700 text-accent-ink inset-shadow-[0_1px_0_rgb(255_255_255/.18)] hover:bg-accent-800`;
const SECONDARY = `${BTN} border-stone-300 bg-stone-50 text-stone-800 inset-shadow-[0_1px_0_white] hover:bg-stone-100`;
const CARD = 'bg-[#fffdfb] rounded-2xl shadow-sm';
const TINTS = ['bg-sky-100 text-sky-900', 'bg-pink-100 text-pink-900', 'bg-teal-100 text-teal-900', 'bg-amber-100 text-amber-900', 'bg-violet-100 text-violet-900'];
const SLOTS = 3; // priorities per day; each person can change it, 3 by default

/* ---- Data ------------------------------------------------------------------------------------- */
const members = [
  { id: 'p', name: 'Patrick', me: true, avatar: { icon: 'sailing', tint: 0 }, planAt: '20:00' },
  { id: 'mo', name: 'Mona', avatar: { icon: 'local_florist', tint: 1 }, planAt: '21:00' },
  { id: 'ma', name: 'Mara', avatar: { icon: 'pets', tint: 2 }, planAt: '19:30' },
];
const stores = [
  { id: 'lidl', name: 'Lidl', where: 'Winnenden' },
  { id: 'aldi', name: 'Aldi', where: 'Waiblingen' },
  { id: 'dm', name: 'dm', where: 'Winnenden' },
];
/* Common problems, known to the family. Each has its solutions (tasks); a trip shops the lists it names.
   Open or not: noticed (for me) or raised (for someone), resolved by hand, noticed again any time. */
const problemKinds = [
  { id: 'food', title: 'Out of food', icon: 'kitchen', fixes: [{ title: 'Go shopping', trip: ['groceries', 'drugstore'] }] },
  { id: 'plants', title: 'Plants are dry', icon: 'potted_plant', fixes: [{ title: 'Water the plants' }] },
  { id: 'laundry', title: 'Laundry piles up', icon: 'local_laundry_service', fixes: [{ title: 'Wash a load' }, { title: 'Hang it up' }, { title: 'Put it away' }] },
  { id: 'bins', title: 'Bins are full', icon: 'delete', fixes: [{ title: 'Take out the trash' }, { title: 'Take out the paper' }] },
  { id: 'bathroom', title: 'Bathroom is dirty', icon: 'shower', fixes: [{ title: 'Clean the sink' }, { title: 'Clean the toilet' }] },
];
let nextId = 100;
const state = {
  tab: 'today',
  view: 'today', // today | tomorrow (plan mode) | pick (fill free slots)
  // Tasks. `day`: 'today' / 'tomorrow' makes it a priority of that day for whoever has it.
  tasks: [
    { id: 1, title: 'Call the dentist', on: 'p', day: 'today' },
    { id: 2, title: 'Pay the electricity bill', on: 'p', day: 'today' },
    { id: 3, title: 'Book the holiday', on: 'p', day: 'today' },
    { id: 4, title: 'Fix the bike light', on: null },
    { id: 5, title: 'Sort the photos', on: null },
    { id: 6, title: 'Clean out the car', on: null },
    { id: 7, title: 'Return the parcel', on: null, overdue: true },
    { id: 8, title: 'Answer the school email', on: 'p', overdue: true },
    { id: 9, title: 'Vacuum the stairs', on: 'mo', day: 'today' },
  ],
  // What to get: items on lists, each with the stores that have it. Ticked off in a store, added back when it runs out.
  items: [
    { id: 'i1', title: 'Milk', list: 'groceries', at: ['lidl', 'aldi'] },
    { id: 'i2', title: 'Bread', list: 'groceries', at: ['lidl'] },
    { id: 'i3', title: 'Bananas', list: 'groceries', at: ['lidl', 'aldi'] },
    { id: 'i4', title: 'Coffee', list: 'groceries', at: ['aldi'] },
    { id: 'i5', title: 'Oat flakes', list: 'groceries', at: ['aldi'] },
    { id: 'i6', title: 'Toothpaste', list: 'drugstore', at: ['dm'] },
    { id: 'i7', title: 'Shampoo', list: 'drugstore', at: ['dm', 'lidl'] },
  ],
  trip: null, // { task, step: 'where' | 'shop', chosen: [store ids] }
  order: { today: [], tomorrow: [] }, // the order of the focus, as refs ('t:1', 'p:food'); new ones go last
  reorder: false, // showing ↑ ↓ on the focus instead of dragging
};
const member = (id) => members.find((m) => m.id === id);
const me = members[0];
const find = (id) => state.tasks.find((t) => t.id == id);
const open = (t) => !t.done;
const priorities = (day) => state.tasks.filter((t) => open(t) && t.on === me.id && t.day === day);
// A slot holds a task or a whole problem (`focus` on the problem).
const focusProblems = (day) => problemKinds.filter((k) => k.open && k.for === me.id && k.focus === day);
const used = (day) => priorities(day).length + focusProblems(day).length;
const freeSlots = (day) => Math.max(0, SLOTS - used(day));
const unassigned = () => state.tasks.filter((t) => open(t) && !t.on && !t.day);
const itemsAt = (store) => state.items.filter((i) => !i.got && i.at.includes(store));
const heading = (text, extra = '') => `<h2 class="flex items-center gap-2 px-2 pt-5 pb-2 text-sm font-semibold text-stone-600">${text}${extra}</h2>`;
const avatar = (m, size = 'size-8') => `<span class="relative ${size} shrink-0 rounded-full grid place-items-center ${TINTS[m.avatar.tint]} ${size === 'size-8' ? 'border-2' : 'border-[3px]'} border-white shadow-[0_1px_3px_rgb(41_37_36/.3)]">${icon(m.avatar.icon, size === 'size-8' ? '!text-[18px]' : size === 'size-6' ? '!text-[14px]' : '')}</span>`;
const dateLabel = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); };

/* ---- Toasts (short version of the main prototype's) --------------------------------------------- */
function toast(text, action, onAction) {
  const el = document.createElement('div');
  el.setAttribute('role', 'status');
  el.className = 'absolute inset-x-0 bottom-0 mx-auto max-w-[360px] flex items-center gap-3 h-16 pl-4 pr-3 rounded-xl bg-white border border-stone-200 shadow-lg text-sm animate-rise';
  el.innerHTML = `<span class="flex-1 min-w-0 truncate">${text}</span>${action ? `<button class="${SECONDARY} !h-10 !px-3">${icon('undo', '!text-[20px]')}${action}</button>` : ''}`;
  el.querySelector('button')?.addEventListener('click', () => { onAction(); el.remove(); });
  $('#toasts').replaceChildren(el);
  setTimeout(() => el.remove(), 4000);
}
function sheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').showModal(); }

/* ---- Order of the focus ------------------------------------------------------------------------ */
/* What is in a day's focus, in my order. */
function focusRefs(day) {
  const refs = [...priorities(day).map((t) => `t:${t.id}`), ...focusProblems(day).map((k) => `p:${k.id}`)];
  const rank = (r) => { const i = state.order[day].indexOf(r); return i < 0 ? 1000 + refs.indexOf(r) : i; };
  return refs.sort((a, b) => rank(a) - rank(b));
}
function placeAt(day, ref, index) {
  const refs = focusRefs(day).filter((r) => r !== ref);
  refs.splice(Math.max(0, Math.min(index, refs.length)), 0, ref);
  state.order[day] = refs;
}
/* Without dragging: ↑ and ↓ next to each one, while "Reorder" is on. */
function orderButtons(day, ref, i, n) {
  const b = (dir, ic, off) => `<button class="size-10 shrink-0 grid place-items-center rounded-full ${off ? 'text-stone-300' : 'text-stone-700 hover:bg-stone-100'}" data-move="${dir}" data-day="${day}" data-ref-move="${ref}" ${off ? 'disabled' : ''} aria-label="Move ${dir}">${icon(ic)}</button>`;
  return b('up', 'keyboard_arrow_up', i === 0) + b('down', 'keyboard_arrow_down', i === n - 1);
}
const reorderToggle = (n) => n > 1 ? `<button class="ml-auto font-semibold text-accent-800 px-2 py-1 -my-1 rounded-md hover:bg-white/60" data-reorder>${state.reorder ? 'Done' : 'Reorder'}</button>` : '';
const handle = () => `<span class="size-11 shrink-0 grid place-items-center text-stone-400 touch-none cursor-grab active:cursor-grabbing" data-drag aria-hidden="true">${icon('drag_indicator')}</span>`;

/* ---- Pieces ------------------------------------------------------------------------------------ */
/* A priority: the circle finishes it, a trip opens the shop flow. */
function priorityCard(t, ctl = '') {
  const trip = t.trip ? `<span class="block text-sm text-stone-600">${state.items.filter((i) => !i.got).length} things to get</span>` : '';
  return `<li class="${CARD} mb-2" data-card="${t.id}" data-ref="t:${t.id}">
    <div class="flex items-center gap-1 pl-1 ${ctl ? 'pr-1' : 'pr-3'} min-h-16">
      <label class="size-12 shrink-0 grid place-items-center cursor-pointer">
        <input type="checkbox" class="peer sr-only" data-check="${t.id}" aria-label="Done: ${t.title}">
        <span class="size-6 rounded-full border-2 border-stone-400 grid place-items-center hover:border-accent-700 peer-checked:bg-accent-700 peer-checked:border-accent-700 peer-checked:animate-pop">${icon('check', '!text-[16px] text-accent-ink')}</span>
      </label>
      <span class="flex-1 min-w-0 py-3"><span class="block text-base truncate">${t.title}</span>${trip}</span>
      ${t.trip && !state.reorder ? `<button class="${PRIMARY} !h-9 !px-3" data-trip="${t.id}">${icon('shopping_cart', '!text-[18px]')}Start</button>` : ''}${ctl}
    </div>
  </li>`;
}
/* A free slot: dashed, an invitation to pick something. */
const freeSlot = (day) => `<li class="mb-2"><button class="w-full flex items-center gap-3 pl-4 pr-3 min-h-16 rounded-2xl border-2 border-dashed border-stone-400/70 bg-white/40 text-stone-600 hover:bg-white/70" data-pick="${day}">
  <span class="size-6 rounded-full border-2 border-dashed border-stone-400"></span><span class="flex-1 text-left">Free slot</span>${day === 'today' ? `<span class="text-sm">Pick something</span>${icon('chevron_right', 'text-stone-500')}` : ''}</button></li>`;

/* A problem in focus: one card that opens it, to work on its steps. */
const focusProblemCard = (k, ctl = '') => `<li class="${CARD} mb-2 flex items-center ${ctl ? 'pr-1' : ''}" data-ref="p:${k.id}"><button class="flex-1 min-w-0 flex items-center gap-3 pl-3 pr-3 min-h-16 text-left" data-open-problem="${k.id}">
  ${problemIcon(k)}<span class="flex-1 min-w-0"><span class="block truncate">${k.title}</span><span class="block text-sm text-stone-600">Problem · ${openFor(k).replace('Open', 'open')}</span></span>${ctl ? '' : icon('chevron_right', 'text-stone-500')}</button>${ctl}</li>`;
/* Today's priorities in my order. Drag one by its handle to reorder, or switch on Reorder for ↑ ↓. */
function prioritySection(day) {
  const refs = focusRefs(day), n = refs.length;
  const slots = Array.from({ length: SLOTS - n }, () => freeSlot(day)).join('');
  const cards = refs.map((ref, i) => {
    const ctl = n < 2 ? '' : state.reorder ? orderButtons(day, ref, i, n) : handle();
    const [kind, id] = ref.split(':');
    return kind === 't' ? priorityCard(find(id), ctl) : focusProblemCard(kindById(id), ctl);
  }).join('');
  return `${heading(`Priorities <span class="font-normal text-stone-500">${n}/${SLOTS}</span>`, reorderToggle(n))}<ul id="focusZone">${cards}${slots}</ul>`;
}

const kindById = (id) => problemKinds.find((k) => k.id === id);
const myProblems = () => problemKinds.filter((k) => k.open && k.for === me.id);
const problemIcon = (k) => `<span class="size-9 shrink-0 rounded-full grid place-items-center ${k.open ? 'bg-amber-100 text-amber-900' : 'bg-stone-100 text-stone-500'}">${icon(k.icon, '!text-[20px]')}</span>`;
/* Who has an open problem, as a picture that reassigns it. */
const problemOwner = (k) => `<button class="shrink-0 size-11 grid place-items-center" data-assign-problem="${k.id}" aria-label="Assign ${k.title}">${avatar(member(k.for))}</button>`;
const problemLine = (k) => !k.open ? `${k.fixes.length} ${k.fixes.length === 1 ? 'solution' : 'solutions'}`
  : k.for === me.id ? (k.by === me.id ? 'You noticed it' : `Raised by ${member(k.by).name}`) : `Raised for ${member(k.for).name}`;
/* Problems: a plain list of the open ones, like tasks. Step into one to work on its tasks. */
/* How long it has been open, said plainly. */
function openFor(k) {
  const h = Math.floor((Date.now() - k.since) / 3_600_000);
  if (h < 1) return 'Open since just now';
  if (h < 24) return `Open for ${h} h`;
  const days = Math.floor(h / 24);
  return days === 1 ? 'Open since yesterday' : `Open for ${days} days`;
}
function renderProblems() {
  const opened = problemKinds.filter((k) => k.open);
  const rows = opened.map((k) => {
    return `<li class="${CARD} mb-2"><button class="w-full flex items-center gap-3 pl-3 pr-3 min-h-16 text-left" data-open-problem="${k.id}">
      ${problemIcon(k)}<span class="flex-1 min-w-0"><span class="block truncate">${k.title}</span><span class="block text-sm text-stone-600">${openFor(k)}</span></span>
      ${avatar(member(k.for))}${icon('chevron_right', 'text-stone-500')}</button></li>`;
  }).join('');
  const list = opened.length ? `<ul>${rows}</ul>`
    : `<div class="flex flex-col items-center text-center gap-2 py-16 px-8">
        <span class="size-16 mb-2 rounded-full grid place-items-center bg-accent-100 text-accent-800">${icon('sentiment_satisfied', '!text-[32px]')}</span>
        <span class="text-lg font-semibold">No problems</span><span class="text-stone-600">All calm at home.</span></div>`;
  return list;
}
/* One problem: its tasks, to work on right here. The pencil in the top bar edits it; Resolve closes it. */
function renderProblem() {
  const k = kindById(state.problem);
  const tasks = k.tasks.map(find).filter(open);
  const list = tasks.length ? `<ul>${tasks.map(priorityCard).join('')}</ul>`
    : `<div class="flex flex-col items-center text-center gap-2 py-12 px-8">
        <span class="size-16 mb-2 rounded-full grid place-items-center bg-accent-100 text-accent-800">${icon('task_alt', '!text-[32px]')}</span>
        <span class="text-lg font-semibold">All steps done</span><span class="text-stone-600">Fixed? Then resolve it.</span></div>`;
  const resolve = k.open ? `<div class="pt-4"><button class="${tasks.length ? SECONDARY : PRIMARY} w-full !h-12" data-resolve="${k.id}">${icon('done_all', '!text-[20px]')}Resolve</button></div>`
    : `<div class="pt-4 grid grid-cols-2 gap-2"><button class="${SECONDARY} !h-12" data-raise="${k.id}">Raise</button><button class="${PRIMARY} !h-12" data-notice="${k.id}">Notice</button></div>`;
  return `${k.open ? `<p class="px-2 pb-3 text-sm text-stone-600">${openFor(k)}</p>${list}` : '<p class="py-12 text-center text-stone-600">Resolved. Notice it again if it’s back.</p>'}${resolve}`;
}
/* Something's wrong: type it; problems the family had before are suggested, to bring back with Notice or Raise. */
function wrongSheet() {
  sheet(`<h2 class="text-lg font-semibold pb-3">What’s wrong?</h2>
    <input id="wrongInput" placeholder="e.g. Out of food" autocomplete="off" class="w-full h-12 px-4 rounded-xl bg-white ring-1 ring-stone-300 outline-none focus:ring-2 focus:ring-accent-700">
    <ul id="wrongList" class="pt-2 max-h-[50dvh] overflow-y-auto"></ul>`);
  fillWrongList('');
  $('#wrongInput').focus();
}
function fillWrongList(typed) {
  const q = typed.trim().toLowerCase();
  const known = problemKinds.filter((k) => !k.open && (!q || k.title.toLowerCase().includes(q)));
  const exact = problemKinds.some((k) => k.title.toLowerCase() === q);
  const rows = known.map((k) => `<li class="flex items-center gap-2 min-h-14 border-b border-stone-100">
      ${problemIcon(k)}<span class="flex-1 min-w-0"><span class="block truncate">${k.title}</span><span class="block text-xs text-stone-600 truncate">${k.fixes.map((f) => f.title).join(' · ') || 'No solutions yet'}</span></span>
      <button class="${SECONDARY} !h-9 !px-3 text-sm" data-raise="${k.id}">Raise</button><button class="${PRIMARY} !h-9 !px-3 text-sm" data-notice="${k.id}">Notice</button></li>`).join('');
  const create = q && !exact ? `<li><button class="w-full flex items-center gap-3 min-h-14 text-left" data-create-problem>
      <span class="size-9 shrink-0 rounded-full grid place-items-center bg-accent-100 text-accent-800">${icon('add', '!text-[20px]')}</span>
      <span class="flex-1">New problem “${typed.trim()}”</span>${icon('chevron_right', 'text-stone-500')}</button></li>` : '';
  $('#wrongList').innerHTML = `${known.length ? `<li class="pt-2 pb-1 text-sm font-semibold text-stone-600">${q ? 'Had this before?' : 'Problems you had before'}</li>` : ''}${rows}${create}`;
}
/* Editing a problem: its name, who has it, and its solutions. While it is open, each solution is a task to tick. */
function renderEditProblem() {
  const k = kindById(state.edit);
  const status = k.open
    ? `${heading('Who has it')}<div class="${CARD} flex items-center gap-3 pl-4 pr-2 min-h-16"><span class="flex-1">${member(k.for).me ? 'Me' : member(k.for).name}</span>${problemOwner(k)}</div>` : '';
  const solutions = k.fixes.map((f, i) => {
    const tick = `<span class="size-11 shrink-0 grid place-items-center text-stone-400">${icon(f.trip ? 'shopping_cart' : 'task_alt', '!text-[20px]')}</span>`;
    return `<li class="flex items-center gap-1 pl-1 pr-2 min-h-14">${tick}
      <span class="flex-1 min-w-0"><span class="block truncate">${f.title}</span>${f.trip ? `<span class="block text-xs text-stone-600 no-underline">Shops: ${f.trip.map((l) => ({ groceries: 'Groceries', drugstore: 'Drugstore' })[l]).join(', ')}</span>` : ''}</span>

/* Tomorrow (plan mode): tomorrow's focus on top (the free slots), then my open problems, then what is left over.
   Anything below moves up into a free slot: tap its arrow, or drag it by the handle. Up there, it moves back the same way. */
const leftovers = () => state.tasks.filter((t) => open(t) && t.day !== 'tomorrow'
  && ((t.day === 'today' && t.on === me.id) || (t.overdue && !t.day && (t.on === me.id || !t.on))));
function planRow(ref, lead, title, sub, inFocus, full, order = '') {
  const move = order || (inFocus
    ? `<button class="size-11 shrink-0 grid place-items-center rounded-full text-stone-600 hover:bg-stone-100" data-unfocus="${ref}" aria-label="Move ${title} back">${icon('arrow_downward')}</button>`
    : `<button class="size-11 shrink-0 grid place-items-center rounded-full ${full ? 'text-stone-300' : 'text-accent-700 hover:bg-accent-50'}" data-focus="${ref}" aria-label="Move ${title} into focus" ${full ? 'aria-disabled="true"' : ''}>${icon('arrow_upward')}</button>`);
  return `<li class="${CARD} mb-2 flex items-center gap-2 pl-1 pr-1 min-h-16" data-ref="${ref}">
    <span class="size-11 shrink-0 grid place-items-center text-stone-400 touch-none cursor-grab active:cursor-grabbing" data-drag aria-hidden="true">${icon('drag_indicator')}</span>
    ${lead}<span class="flex-1 min-w-0"><span class="block truncate">${title}</span>${sub ? `<span class="block text-sm text-stone-600 truncate">${sub}</span>` : ''}</span>${move}</li>`;
}
const taskLead = () => `<span class="size-9 shrink-0 rounded-full grid place-items-center bg-stone-100 text-stone-600">${icon('task_alt', '!text-[20px]')}</span>`;
function renderTomorrow() {
  const full = freeSlots('tomorrow') === 0;
  const refs = focusRefs('tomorrow');
  const inFocus = refs.map((ref, i) => {
    const [kind, id] = ref.split(':'), order = state.reorder ? orderButtons('tomorrow', ref, i, refs.length) : '';
    if (kind === 't') { const t = find(id); return planRow(ref, taskLead(), t.title, '', true, false, order); }
    const k = kindById(id); return planRow(ref, problemIcon(k), k.title, 'Problem', true, false, order);
  });
  const free = Array.from({ length: SLOTS - inFocus.length }, () => `<li class="mb-2 flex items-center gap-3 pl-4 pr-3 min-h-16 rounded-2xl border-2 border-dashed border-stone-400/70 bg-white/40 text-stone-600">
    <span class="size-6 rounded-full border-2 border-dashed border-stone-400"></span><span class="flex-1">Free slot</span></li>`).join('');
  const problems = myProblems().filter((k) => k.focus !== 'tomorrow');
  const rest = leftovers();
  const pool = `${problems.length ? `${heading('Problems')}<ul>${problems.map((k) => planRow(`p:${k.id}`, problemIcon(k), k.title, openFor(k), false, full)).join('')}</ul>` : ''}
    ${rest.length ? `${heading('Left over')}<ul>${rest.map((t) => planRow(`t:${t.id}`, taskLead(), t.title, t.day === 'today' ? 'From today' : 'Overdue', false, full)).join('')}</ul>` : ''}
    ${!problems.length && !rest.length ? '<p class="py-8 text-center text-stone-600">Nothing left over. Fresh start tomorrow.</p>' : ''}`;
  return `${heading(`Tomorrow’s focus <span class="font-normal text-stone-500">${inFocus.length}/${SLOTS}</span>`, reorderToggle(inFocus.length))}
    <ul id="focusZone" class="rounded-2xl transition-shadow">${inFocus.join('')}${free}</ul>
    <div id="planPool" class="rounded-2xl transition-shadow">${pool}</div>`;
}
function moveIntoFocus(ref) {
  if (!freeSlots('tomorrow')) { toast('Tomorrow’s focus is full. Move one back first.'); return false; }
  const [kind, id] = ref.split(':');
  if (kind === 't') { const t = find(id); t.prevDay = t.day; t.day = 'tomorrow'; t.on = me.id; }
  else kindById(id).focus = 'tomorrow';
  return true;
}
function moveBack(ref) {
  const [kind, id] = ref.split(':');
  if (kind === 't') { const t = find(id); t.day = t.prevDay ?? null; }
  else kindById(id).focus = null;
}
/* Drag by the handle (mouse, pen or finger): within the focus it reorders; in plan mode, dropped on the focus it moves
   up (where it is dropped), dropped below it moves back. */
const dropIndex = (zone, e, ref) => [...zone.querySelectorAll('[data-ref]')].filter((r) => r.dataset.ref !== ref)
  .filter((r) => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 < e.clientY; }).length;
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('[data-drag]'); if (!handle) return;
  const row = handle.closest('[data-ref]'), box = row.getBoundingClientRect();
  e.preventDefault();
  const ghost = row.cloneNode(true);
  ghost.className += ' fixed z-50 pointer-events-none shadow-xl rotate-1 opacity-95';
  Object.assign(ghost.style, { left: `${box.left}px`, top: `${box.top}px`, width: `${box.width}px`, margin: 0 });
  document.body.append(ghost);
  row.classList.add('opacity-30');
  drag = { ref: row.dataset.ref, row, ghost, dy: e.clientY - box.top, fromFocus: !!row.closest('#focusZone') };
});
const over = (el, e) => { const r = el?.getBoundingClientRect(); return r && e.clientY >= r.top && e.clientY <= r.bottom; };
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  drag.ghost.style.top = `${e.clientY - drag.dy}px`;
  for (const zone of [$('#focusZone'), $('#planPool')]) {
    zone?.classList.toggle('ring-2', over(zone, e)); zone?.classList.toggle('ring-accent-700', over(zone, e));
  }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const { ref, ghost, fromFocus } = drag; drag = null; ghost.remove();
  const day = state.view === 'tomorrow' ? 'tomorrow' : 'today', zone = $('#focusZone');
  if (over(zone, e) && (fromFocus || moveIntoFocus(ref))) placeAt(day, ref, dropIndex(zone, e, ref));
  else if (fromFocus && over($('#planPool'), e)) moveBack(ref);
  render();
});

/* ---- Actions ----------------------------------------------------------------------------------- */
function finish(t) {
  t.done = true;
  const wasPriority = t.day === 'today' && t.on === me.id;
  t.doneToday = true;
  toast(`${t.title} done`, 'Undo', () => { t.done = false; t.doneToday = false; render(); });
  if (wasPriority) celebrateIfAllDone();
}
/* The last open priority of the day (a task or a problem in focus): celebrate. */
function celebrateIfAllDone() {
  if (used('today') > 0) return;
  state.kitty = Math.floor(Math.random() * 4);
  setTimeout(() => { state.celebrate = true; render(); }, 450);
}
/* Noticing or raising opens the problem: each solution becomes a task for whoever has it. */
function notice(kind, forWhom, by = me.id) {
  const k = kindById(kind);
  k.tasks = k.fixes.map((f) => { const t = { id: nextId++, title: f.title, on: forWhom, trip: f.trip }; state.tasks.push(t); return t.id; });
  Object.assign(k, { open: true, for: forWhom, by, since: Date.now() });
}
function assignProblem(k, to) {
  k.for = to;
  k.tasks.map(find).filter(open).forEach((t) => { t.on = to; t.day = null; });
}

$('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) $('#sheet').close(); });

});

  const el = e.target.closest('button, input, a'); if (!el) return;
  const d = el.dataset;
  if (d.tab) { state.tab = d.tab; state.view = 'today'; state.edit = null; state.problem = null; state.reorder = false; }
  else if (el.id === 'backBtn') { if (state.tab === 'family') state.tab = state.prevTab ?? 'today'; else if (state.edit) state.edit = null; else if (state.problem) state.problem = null; else state.view = 'today'; }
  else if (el.id === 'editBtn') { state.edit = state.problem; }
  else if (el.closest('#meBtn')) { if (state.tab !== 'family') state.prevTab = state.tab; state.tab = 'family'; }
  else if (d.check) { const t = find(d.check); if (t.done) { t.done = false; } else { setTimeout(() => { finish(t); render(); }, 250); return; } }
  else if ('planLater' in d) { state.view = 'today'; toast('I’ll ask again in 30 minutes'); }
  else if ('reorder' in d) { state.reorder = !state.reorder; }
  else if (d.move) { const refs = focusRefs(d.day), i = refs.indexOf(d.refMove); placeAt(d.day, d.refMove, d.move === 'up' ? i - 1 : i + 1); }
  else if (d.focus) { moveIntoFocus(d.focus); }
  else if (d.unfocus) { moveBack(d.unfocus); }
  else if ('planDone' in d) {
    // Tomorrow becomes today (in the prototype, at once).
    state.tasks.forEach((t) => { if (t.day === 'today' && open(t) && t.on === me.id) t.day = null; if (t.day === 'tomorrow') t.day = 'today'; });
    problemKinds.forEach((k) => { k.focus = k.focus === 'tomorrow' ? 'today' : null; });
    state.order = { today: state.order.tomorrow, tomorrow: [] }; state.reorder = false;
    state.view = 'today'; state.tasks.forEach((t) => (t.doneToday = false)); toast('Planned. See you tomorrow.');
  }
  else if (d.pick) { state.celebrate = false; state.view = 'pick'; }
  else if (d.take) {
    const t = find(d.take); t.on = me.id; t.day = 'today';
    if (freeSlots('today') === 0) { state.view = 'today'; toast('Today is full again'); }
  }
  else if ('rest' in d) { state.celebrate = false; }
  else if (d.openProblem) { state.tab = 'problems'; state.problem = d.openProblem; state.edit = null; }
  else if ('somethingWrong' in d) { wrongSheet(); return; }
  else if ('createProblem' in d) {
    // A new problem: name it, add its solutions, then Notice or Raise it.
    const k = { id: `k${nextId++}`, title: $('#wrongInput').value.trim(), icon: 'report', fixes: [] };
    problemKinds.push(k); state.tab = 'problems'; state.problem = k.id; state.edit = k.id; $('#sheet').close();
    render(); $('#newFix').focus(); return;
  }
  else if (d.removeFix) {
    const k = kindById(state.edit), i = +d.removeFix;
    k.fixes.splice(i, 1); if (k.open) k.tasks.splice(i, 1);
  }
  else if (d.notice) { notice(d.notice, me.id); $('#sheet').close(); toast(`Noticed: ${kindById(d.notice).title}`); }
  else if (d.raise || d.assignProblem) {
    const k = kindById(d.raise ?? d.assignProblem), raising = !!d.raise;
    sheet(`<h2 class="text-lg font-semibold pb-3">${raising ? 'Raise' : 'Assign'} “${k.title}” for</h2>
      <ul>${members.filter((m) => raising ? !m.me : true).map((m) => `<li><button class="w-full flex items-center gap-3 min-h-14 text-left" data-for="${m.id}" data-kind="${k.id}" data-mode="${raising ? 'raise' : 'assign'}">${avatar(m, 'size-10')}<span class="flex-1">${m.me ? 'Me' : m.name}</span>${k.open && k.for === m.id ? icon('check', 'text-accent-700') : icon('chevron_right', 'text-stone-500')}</button></li>`).join('')}</ul>`);
    return;
  }
  else if (d.for) {
    const k = kindById(d.kind);
    if (d.mode === 'raise') { notice(k.id, d.for); toast(`Raised for ${member(d.for).name}`); }
    else { assignProblem(k, d.for); toast(d.for === me.id ? `${k.title}: yours now` : `${k.title}: ${member(d.for).name} has it now`); }
    $('#sheet').close();
  }
  else if (d.resolve) { const k = kindById(d.resolve); const wasFocus = k.focus === 'today'; k.open = false; if (wasFocus) celebrateIfAllDone(); toast(`Resolved: ${k.title}`, 'Undo', () => { k.open = true; render(); }); }
  else if (d.trip) { state.trip = { task: +d.trip, step: 'where', chosen: [] }; }
  else if (d.store) { const c = state.trip.chosen; el.checked ? c.push(d.store) : c.splice(c.indexOf(d.store), 1); }
  else if ('tripGo' in d) { state.trip.step = 'shop'; }
  else if (d.got) { const i = state.items.find((x) => x.id === d.got); i.got = el.checked; i.gotAt = el.checked ? d.at : null; }
  else if ('tripEnd' in d) {
    const left = state.items.filter((i) => !i.got).length;
    state.items = state.items.filter((i) => !i.got);
    const t = find(state.trip.task); state.trip = null;
    finish(t);
    if (left) setTimeout(() => toast(`${left} things wait for the next trip`), 1200);
  }
  else if ('tripClose' in d) { state.trip = null; }
  else return;
  render();
});

/* ---- Background (Ocean, from the main prototype) ----------------------------------------------- */
const W = (dd, fill, op = 1) => `<path d="${dd}" fill="${fill}" opacity="${op}"/>`;
const drift = (speed, body) => `<g class="motion-safe:animate-drift-${speed}">${body}</g>`;
$('#scene').innerHTML = `<svg viewBox="0 0 430 320" preserveAspectRatio="xMidYMax slice" class="size-full">${
    drift('far', W('M-40 190 C30 178 110 200 180 190 S320 178 470 192 V320 H-40Z', '#7dd3fc'))
  + drift('mid', W('M-40 230 C40 213 140 240 210 228 S360 213 470 232 V320 H-40Z', '#38bdf8', .8))
  + drift('near', W('M-40 275 C60 258 160 285 240 272 S380 260 470 278 V320 H-40Z', '#0ea5e9', .6))}</svg>`;
$('#app').className += ' bg-linear-to-b from-sky-200 to-cyan-100 [--color-accent-50:#fff1f2] [--color-accent-100:#ffe4e6] [--color-accent-200:#fecdd3] [--color-accent-700:#be123c] [--color-accent-800:#9f1239] [--color-accent-900:#881337]';

// ?tab=problems|family, ?open=laundry (one problem), ?today=1 (no planning), ?done=2 (two done today), ?plan=1, ?celebrate=0..3, ?pick=1, ?problem=1 (one noticed, one raised by Mona), ?trip=1, ?trip=shop
const q = new URLSearchParams(location.search);
// With no options (e.g. opened on a phone): it is 20:00, so planning has opened by itself; three problems are open.
const demo = ![...q.keys()].filter((k) => k !== 'tab' && k !== 'open').length;
if (q.get('tab')) state.tab = q.get('tab');
if (q.get('open')) { state.tab = 'problems'; state.problem = q.get('open'); }
if (demo || q.has('problem') || q.has('trip')) {
  const hoursAgo = (h) => Date.now() - h * 3_600_000;
  notice('food', me.id); kindById('food').since = hoursAgo(50);
  notice('laundry', me.id, 'mo'); kindById('laundry').since = hoursAgo(5);
  notice('bins', 'ma'); kindById('bins').since = hoursAgo(26);
}
if ((demo && !q.get('tab') && !q.get('open')) || q.has('plan')) state.view = 'tomorrow';
if (q.has('celebrate')) { state.tasks.filter((t) => t.day === 'today' && t.on === me.id).forEach((t) => (t.done = t.doneToday = true)); state.celebrate = true; state.kitty = +q.get('celebrate') || 0; }
if (q.has('done')) state.tasks.filter((t) => t.day === 'today' && t.on === me.id).slice(0, +q.get('done') || 1).forEach((t) => (t.done = t.doneToday = true));
if (q.has('pick')) { state.tasks.filter((t) => t.day === 'today' && t.on === me.id).slice(0, 2).forEach((t) => (t.done = t.doneToday = true)); state.view = 'pick'; }
if (q.has('trip')) { const t = state.tasks.find((x) => x.trip); state.trip = { task: t.id, step: q.get('trip') === 'shop' ? 'shop' : 'where', chosen: q.get('trip') === 'shop' ? ['lidl', 'dm'] : [] }; if (q.get('trip') === 'shop') state.items[0].got = true, state.items[0].gotAt = 'lidl'; }
render();
</script>
</body>
