[package]
name = "tackly-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Remote control of the web view for the acceptance tests. Never in release builds.
ui-test = ["dep:serde_json"]

[dependencies]
tackly-client.workspace = true
tackly-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "macro", "hooks", "html", "signals", "document"] }
serde_json = { workspace = true, optional = true }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }
