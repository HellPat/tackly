[package]
name = "tackly-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary is "tackly": the Dioxus CLI names the Android app after it.
[[bin]]
name = "tackly"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Remote control of the web view for the acceptance tests. Never in release builds.
ui-test = []

[lints]
workspace = true

[dependencies]
tackly-client.workspace = true
tackly-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "macro", "hooks", "html", "signals", "document"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false }
